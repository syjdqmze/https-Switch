<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Speaker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 10px;
            background: linear-gradient(90deg, #ADD8E6 0%, #D6C5E8 50%, #ADD8E6 100%);
            background-size: 200% 100%;
            animation: gradientFlow 6s linear infinite;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .tab-title {
            font-size: 25px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            user-select: none;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 0 6px rgba(255, 255, 255, 0.4);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3), 0 0 14px rgba(255, 255, 255, 0.9);
                transform: scale(1.05);
            }
        }

        .content {
            display: flex;
            gap: 3px;
            flex: 1;
            min-height: 0;
            background: #ADD8E6;
        }

        .left-panel {
            flex: 3;
            background: #f5f7fa;
            border: 5px solid #FFD9E2;
        }

        .right-panel {
            flex: 2;
            background: #ADD8E6;
            display: flex;
            flex-direction: column;
        }

        .right-top {
            flex: 1;
            background: #f5f7fa;
            border: 5px solid #FFD9E2;
            margin-bottom: -5px;
            position: relative;
            z-index: 2;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .message-list::-webkit-scrollbar {
            width: 6px;
        }

        .message-list::-webkit-scrollbar-thumb {
            background: rgba(255, 182, 193, 0.6);
            border-radius: 3px;
        }

        .message-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .right-bottom {
            height: 100px;
            background: #f5f7fa;
            border: 5px solid #FFD9E2;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
        }

        .text-input {
            flex: 1;
            min-width: 0;
            height: 85px;
            padding: 6px 8px;
            font-size: 14px;
            line-height: 1.4;
            font-family: inherit;
            border: 1px solid #D6C5E8;
            border-radius: 6px;
            outline: none;
            background: #fff;
            color: #333;
            margin-left: -8px;
            resize: none;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .text-input::placeholder {
            color: #aaa;
        }

        .text-input:focus {
            border-color: #FFB6C1;
            box-shadow: 0 0 0 3px rgba(255, 182, 193, 0.25);
        }

        .audio-btn {
            flex-shrink: 0;
            width: 45px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #FFD9E2 0%, #FFB6C1 100%);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .audio-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(255, 182, 193, 0.5);
        }

        .audio-btn:active {
            transform: translateY(0);
        }

        .audio-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.15));
        }

        .audio-btn.active {
            background: linear-gradient(135deg, #FF6B6B 0%, #E03131 100%);
            animation: micPulse 1.2s ease-in-out infinite;
        }

        @keyframes micPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(224, 49, 49, 0.6);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(224, 49, 49, 0);
            }
        }

        .volume-indicator {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
            pointer-events: none;
            z-index: 3;
        }

        .volume-bar {
            width: 3px;
            height: 12px;
            background: #D6C5E8;
            border-radius: 2px;
            transition: height 0.08s ease, background 0.08s ease;
        }

        .volume-bar.active {
            background: #E03131;
        }

        .message-item {
            align-self: flex-end;
            max-width: 100%;
            padding: 6px 10px;
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            background: #FFE4EC;
            border: 1px solid #FFB6C1;
            border-radius: 10px 10px 2px 10px;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message-item.left {
            align-self: flex-start;
            background: #E8F4FD;
            border-color: #ADD8E6;
            border-radius: 10px 10px 10px 2px;
        }

        .message-item.game-instructions {
            align-self: center;
            background: linear-gradient(135deg, #FFF8E1 0%, #FFF3CD 100%);
            border: 1px solid #FFD54F;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.7;
            color: #5D4037;
            max-width: 100%;
        }

        .status-hint {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            pointer-events: none;
            z-index: 3;
            display: none;
        }

        /* 语音活动指示器 */
        .speech-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #888;
            position: absolute;
            top: 4px;
            right: 8px;
            z-index: 5;
        }
        .speech-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.15s ease;
        }
        .speech-indicator.active .speech-dot {
            background: #4CAF50;
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.6);
        }
        .speech-indicator.active {
            color: #4CAF50;
        }

        /* ===== 游戏画布 ===== */
        .game-canvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #4A90D9 0%, #87CEEB 30%, #B0E0E6 45%, #90EE90 60%, #228B22 100%);
            position: relative;
            overflow: hidden;
        }

        /* 云朵 */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
            animation: cloudDrift linear infinite;
            z-index: 1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud-1 {
            width: 70px; height: 28px;
            top: 8%; left: -90px;
            animation-duration: 120s;
        }
        .cloud-1::before { width: 36px; height: 36px; top: -18px; left: 12px; }
        .cloud-1::after  { width: 24px; height: 24px; top: -10px; left: 40px; }

        .cloud-2 {
            width: 90px; height: 34px;
            top: 18%; left: -110px;
            animation-duration: 165s;
            animation-delay: -60s;
            opacity: 0.75;
        }
        .cloud-2::before { width: 44px; height: 44px; top: -22px; left: 18px; }
        .cloud-2::after  { width: 30px; height: 30px; top: -14px; left: 52px; }

        .cloud-3 {
            width: 55px; height: 22px;
            top: 5%; left: -70px;
            animation-duration: 105s;
            animation-delay: -36s;
            opacity: 0.8;
        }
        .cloud-3::before { width: 28px; height: 28px; top: -14px; left: 10px; }
        .cloud-3::after  { width: 20px; height: 20px; top: -8px;  left: 30px; }

        @keyframes cloudDrift {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(100vw + 150px)); }
        }

        .horse-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .horse-svg {
            width: 100px;
            height: 100px;
            transition: transform 0.3s ease;
        }

        /* ===== 行走动画 ===== */
        .horse-container.moving {
            animation: horseGallop 0.25s ease-in-out infinite;
        }
        .horse-container.moving .horse-leg-fl {
            transform-origin: 66.5px 76px;
            animation: legSwingF 0.4s ease-in-out infinite;
        }
        .horse-container.moving .horse-leg-fr {
            transform-origin: 78.5px 76px;
            animation: legSwingB 0.4s ease-in-out infinite;
        }
        .horse-container.moving .horse-leg-bl {
            transform-origin: 32.5px 76px;
            animation: legSwingB 0.4s ease-in-out infinite;
        }
        .horse-container.moving .horse-leg-br {
            transform-origin: 44.5px 76px;
            animation: legSwingF 0.4s ease-in-out infinite;
        }
        .horse-container.moving .horse-tail {
            animation: tailSway 0.35s ease-in-out infinite;
        }
        .horse-container.moving .horse-mane {
            animation: maneBounce 0.25s ease-in-out infinite;
        }

        @keyframes horseGallop {
            0%, 100% { margin-top: 0; }
            50% { margin-top: -4px; }
        }
        @keyframes legSwingF {
            0%, 100% { transform: rotate(20deg); }
            50% { transform: rotate(-20deg); }
        }
        @keyframes legSwingB {
            0%, 100% { transform: rotate(-20deg); }
            50% { transform: rotate(20deg); }
        }
        @keyframes tailSway {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(-5px) rotate(-12deg); }
        }
        @keyframes maneBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .game-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="tab-bar">
        <div class="tab-title">Speaker-I</div>
    </div>
    <div class="content">
        <div class="left-panel">
            <div class="game-canvas" id="gameCanvas" style="display:none">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="horse-container" id="horseContainer" style="display:none">
                    <svg class="horse-svg" id="horseSvg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <!-- 尾巴 -->
                        <g class="horse-tail">
                            <path d="M15 55 Q2 40 8 25 Q12 35 15 45" stroke="#6B3A1F" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M15 55 Q0 45 5 30" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>
                        <!-- 身体 -->
                        <ellipse cx="55" cy="58" rx="38" ry="25" fill="#A0522D"/>
                        <ellipse cx="55" cy="62" rx="30" ry="16" fill="#CD853F" opacity="0.4"/>
                        <!-- 后腿 -->
                        <rect class="horse-leg-bl" x="28" y="76" width="9" height="26" rx="4" fill="#8B4513"/>
                        <rect class="horse-leg-br" x="40" y="76" width="9" height="26" rx="4" fill="#A0522D"/>
                        <!-- 前腿 -->
                        <rect class="horse-leg-fl" x="62" y="76" width="9" height="26" rx="4" fill="#8B4513"/>

                        <!-- 蹄子 -->
                        <ellipse cx="32" cy="103" rx="6" ry="3" fill="#3E2723"/>
                        <ellipse cx="44" cy="103" rx="6" ry="3" fill="#3E2723"/>
                        <ellipse cx="66" cy="103" rx="6" ry="3" fill="#3E2723"/>
                        <ellipse cx="78" cy="103" rx="6" ry="3" fill="#3E2723"/>
                        <!-- 脖子 -->
                        <path d="M82 48 Q92 32 97 22 Q102 32 95 50" fill="#A0522D"/>
                        <!-- 头部 -->
                        <ellipse cx="100" cy="22" rx="17" ry="14" fill="#A0522D"/>

                        <ellipse cx="112" cy="28" rx="8" ry="6" fill="#DEB887"/>
                        <!-- 耳朵 -->
                        <path d="M92 10 L88 0 L96 8" fill="#A0522D"/>
                        <path d="M92 10 L89 2 L95 8" fill="#DEB887"/>

                        <path d="M100 9 L99 2 L103 7" fill="#DEB887"/>

                        <path class="horse-mane" d="M88 5 Q92 12 90 20 Q94 14 92 25 Q96 18 94 30 Q98 22 96 35" stroke="#6B3A1F" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <!-- 眼睛 -->
                        <circle cx="104" cy="19" r="4" fill="white"/>
                        <circle cx="105" cy="19" r="2.5" fill="#333"/>
                        <circle cx="106" cy="18" r="1" fill="white"/>
                        <!-- 腮红 -->
                        <ellipse cx="108" cy="26" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.6"/>
                        <!-- 鼻孔 -->
                        <circle cx="115" cy="27" r="1.2" fill="#8B4513"/>
                        <circle cx="115" cy="30" r="1.2" fill="#8B4513"/>
                        <!-- 微笑 -->
                        <path d="M110 32 Q112 34 114 32" stroke="#8B4513" stroke-width="0.8" fill="none"/>
                    </svg>
                </div>
                <div class="game-hint" id="gameHint">语音输入"开始游戏"启动</div>
            </div>
        </div>
        <div class="right-panel">
            <div class="right-top">
                <div class="message-list"></div>
            </div>
            <div class="right-bottom">
                <div class="speech-indicator" id="speechIndicator">
                    <div class="speech-dot"></div>
                    <span>语音检测</span>
                </div>
                <textarea class="text-input" placeholder="请输入文字..."></textarea>
                <button class="audio-btn" title="音频输入">
                    <div class="volume-indicator" id="volumeIndicator">
                        <div class="volume-bar"></div>
                        <div class="volume-bar"></div>
                        <div class="volume-bar"></div>
                        <div class="volume-bar"></div>
                        <div class="volume-bar"></div>
                    </div>
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script>
    (function () {
        const audioBtn = document.querySelector('.audio-btn');
        const textInput = document.querySelector('.text-input');
        const messageList = document.querySelector('.message-list');
        const volumeIndicator = document.getElementById('volumeIndicator');
        const volumeBars = volumeIndicator.querySelectorAll('.volume-bar');

        let shouldListen = false;
        let recognition = null;
        let micStream = null;
        let audioContext = null;
        let analyser = null;
        let animFrameId = null;
        let restartTimer = null; // 延迟重启定时器
        let committedText = ''; // 已确认的最终文本，独立追踪避免重复
        let lastDisplayText = ''; // DOM写入缓存，内容不变时跳过重排

        // 预编译正则（避免每次调用 postProcessChinese 重建 RegExp 对象）
        const reLeadingFiller = /^(?:那个|嗯|啊|呃|额|然后|就是|那|哦|唔|对对对)[，,？?！!、]?\s*/;
        const reMidFiller = /(?<=[。！？；\n]\s*)[，,]?\s*(?:那个|嗯|啊|呃|额|就是|然后)\s*/g;
        const reDupPunct = /([，。！？；])\1+/g;
        // 增强后处理正则（方案5）
        const reStutter = /(.)\1{3,}/g;          // 连续4+次重复字符（口吃检测）
        const reStutterWord = /([\w\u4e00-\u9fff]{1,2})\1{2,}/g; // 连续3+次重复词（如"我我我"→"我"）
        const reNum2 = /二(?!十|百|千|万|亿|月|年级|楼|号|次|手|哥|姐|位|胎|胡)/g;
        // ===== 方案5：VAD 语音活动检测 =====
        var vadAnalyser = null;       // 高分辨率分析器（4096 FFT）
        var vadFreqData = null;       // 频域数据缓冲
        var vadTimeData = null;       // 时域数据缓冲
        var noiseFloor = 28;          // 自适应噪声基底（0-255）
        var noiseUpdateCount = 0;     // 噪声样本计数
        var noiseSum = 0;             // 噪声累加器
        var isSpeechActive = false;   // 当前是否检测到语音
        var speechEnergySmooth = 0;   // 平滑后的语音能量
        var vadMonitorId = null;      // VAD 监控循环 ID
        var noSpeechGateCount = 0;    // 无语音时的识别结果过滤计数
        var speechIndicator = null;   // 语音活动指示器 DOM

        // ===== 游戏状态 =====
        let gameMode = false;
        let gameCanvas = null;
        let horseContainer = null;
        let horseSvg = null;
        let horseX = 50;
        let horseY = 50;
        let horseFacing = 'right';
        let lastExecutedDir = '';
        let currentMoveDir = null; // 当前持续移动方向
        let gameLoopId = null;     // 游戏循环 rAF ID

        // 方向字符映射表（同音字全覆盖）
        const dirChars = [
            { chars: '左走捉卓桌做作座坐错搓挫佐昨', dir: 'left', label: '左' },
            { chars: '右有哟唷育又由游油友优尤佑幼幽要用', dir: 'right', label: '右' },
            { chars: '上商伤尚赏殇熵觞晌绱墒裳', dir: 'up', label: '上' },
            { chars: '下霞吓夏瞎虾侠辖峡匣狭厦', dir: 'down', label: '下' }
        ];

        // ========== 中文语音识别结果后处理 ==========
        function postProcessChinese(text) {
            if (!text) return text;
            // 快速路径：无逗号/句号/感叹号/问号时无需标点修正
            var needsFix = text.indexOf(',') !== -1 || text.indexOf('.') !== -1 ||
                           text.indexOf('!') !== -1 || text.indexOf('?') !== -1;
            var result = text;
            // 1. 移除句首独立语气词
            result = result.replace(reLeadingFiller, '');
            // 2. 移除句中填充性重复语气词
            result = result.replace(reMidFiller, '');
            // 3. 修复高频同音字错误
            result = result.replace(/因该/g, '应该');
            result = result.replace(/以经/g, '已经');
            result = result.replace(/在见/g, '再见');
            result = result.replace(/做天/g, '昨天');
            result = result.replace(/名天/g, '明天');
            result = result.replace(/月量/g, '月亮');
            // 4. 清理连续重复标点
            result = result.replace(reDupPunct, '$1');
            // 5. 去除口吃式重复字符（4+次连续相同字符）
            result = result.replace(reStutter, '$1');
            // 6. 去除口吃式重复短词（如"我我我"→"我"）
            result = result.replace(reStutterWord, '$1');
            // 7. 数字"二"→"两"（非序数语境）
            result = result.replace(reNum2, '两');
            // 8. 仅在需要时修复中英文标点混用
            if (needsFix) {
                result = result.replace(/,/g, '，');
                result = result.replace(/\./g, '。');
                result = result.replace(/!/g, '！');
                result = result.replace(/\?/g, '？');
            }
            return result.trim();
        }

        // ========== 方案5：VAD 语音活动检测系统 ==========

        // 自适应噪声基底估计：在安静环境下持续更新噪声水平
        function updateNoiseFloor(avgEnergy) {
            // 仅在非语音状态时更新噪声基底（避免语音能量污染估计）
            if (!isSpeechActive) {
                noiseSum += avgEnergy;
                noiseUpdateCount++;
                // 每 30 个样本更新一次噪声基底
                if (noiseUpdateCount >= 30) {
                    noiseFloor = Math.max(12, (noiseSum / noiseUpdateCount) * 1.6);
                    noiseSum = 0;
                    noiseUpdateCount = 0;
                }
            }
        }

        // 检测当前帧是否包含语音（基于语音频段能量 vs 噪声基底）
        function detectSpeech() {
            vadAnalyser.getByteFrequencyData(vadFreqData);
            // 语音基频范围：85Hz~800Hz → 对应 FFT bin 约 2~37（@48kHz, 4096 FFT）
            // 谐波范围扩展到 ~3kHz → bin 约 136
            var speechEnergy = 0;
            var speechBins = 0;
            for (var i = 2; i < 136; i++) {
                speechEnergy += vadFreqData[i];
                speechBins++;
            }
            var avgSpeech = speechEnergy / speechBins;
            // 更新自适应噪声基底
            updateNoiseFloor(avgSpeech);
            // 信噪比判定：能量超过噪声基底一定倍数才视为语音
            var snr = avgSpeech / Math.max(noiseFloor, 8);
            // 平滑处理，避免瞬态噪声误触发
            speechEnergySmooth = speechEnergySmooth * 0.7 + snr * 0.3;
            // 迟滞阈值：进入阈值高、退出阈值低，防止边界抖动
            if (speechEnergySmooth > 2.0) {
                isSpeechActive = true;
            } else if (speechEnergySmooth < 1.3) {
                isSpeechActive = false;
            }
            return isSpeechActive;
        }

        // VAD 监控主循环（独立于音量动画，持续运行）
        function startVADMonitor() {
            if (vadMonitorId) return;
            vadFreqData = new Uint8Array(vadAnalyser.frequencyBinCount);
            function tick() {
                detectSpeech();
                // 更新语音活动指示器
                if (speechIndicator) {
                    if (isSpeechActive) {
                        speechIndicator.classList.add('active');
                    } else {
                        speechIndicator.classList.remove('active');
                    }
                }
                vadMonitorId = requestAnimationFrame(tick);
            }
            tick();
        }

        function stopVADMonitor() {
            if (vadMonitorId) {
                cancelAnimationFrame(vadMonitorId);
                vadMonitorId = null;
            }
            isSpeechActive = false;
            speechEnergySmooth = 0;
            if (speechIndicator) speechIndicator.classList.remove('active');
        }

        // 初始化 VAD 音频链路（高分辨率 FFT 用于精确频段分析）
        function initVADChain() {
            if (vadAnalyser) return;
            vadAnalyser = audioContext.createAnalyser();
            vadAnalyser.fftSize = 4096;             // 高分辨率：~11.7Hz/bin @48kHz
            vadAnalyser.smoothingTimeConstant = 0.6; // 平衡时间/频率分辨率
            var vadSource = audioContext.createMediaStreamSource(micStream);
            vadSource.connect(vadAnalyser);
            // 初始噪声基底估计（采集前 60 帧环境噪声）
            var initData = new Uint8Array(64);
            noiseSum = 0;
            noiseUpdateCount = 0;
            for (var i = 0; i < 60; i++) {
                vadAnalyser.getByteFrequencyData(initData);
                var sum = 0;
                for (var j = 2; j < 60; j++) sum += initData[j];
                noiseSum += sum / 58;
                noiseUpdateCount++;
            }
            noiseFloor = Math.max(12, (noiseSum / noiseUpdateCount) * 1.6);
            startVADMonitor();
        }

        // ========== 预先获取麦克风流，保持不释放 ==========
        async function preAcquireMic() {
            if (!micStream) {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,            // 单声道，语音无需立体声
                        echoCancellation: true,      // 消除回声
                        noiseSuppression: true,      // 抑制背景噪声
                        autoGainControl: true,       // 自动增益，平衡音量
                        sampleRate: 48000            // 高采样率，保留更多语音频段细节
                    }
                });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
            }
            // 确保音频上下文处于运行状态，避免 suspended 导致音频链路中断
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            // 方案5：初始化 VAD 语音活动检测链路
            initVADChain();
        }

        // ========== 音量指示器动画（基于真实音频流 + VAD 集成） ==========
        function startVolumeAnimation() {
            volumeIndicator.style.display = 'flex';
            speechIndicator = document.getElementById('speechIndicator');
            speechIndicator.style.display = 'flex';
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function update() {
                analyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                const level = Math.min(avg / 40, 1);

                volumeBars.forEach((bar, i) => {
                    const threshold = (i + 1) / volumeBars.length;
                    if (level >= threshold * 0.6) {
                        bar.classList.add('active');
                        bar.style.height = (6 + level * 10) + 'px';
                    } else {
                        bar.classList.remove('active');
                        bar.style.height = '6px';
                    }
                });

                animFrameId = requestAnimationFrame(update);
            }
            update();
        }

        function stopVolumeAnimation() {
            volumeIndicator.style.display = 'none';
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            volumeBars.forEach(bar => {
                bar.classList.remove('active');
                bar.style.height = '6px';
            });
        }

        // ========== 游戏核心函数 ==========
        function startGame() {
            if (gameMode) return;
            gameMode = true;
            gameCanvas = document.getElementById('gameCanvas');
            horseContainer = document.getElementById('horseContainer');
            horseSvg = document.getElementById('horseSvg');
            gameCanvas.style.display = 'block';
            horseX = 50; horseY = 50; horseFacing = 'right';
            lastExecutedDir = '';
            currentMoveDir = null;
            horseContainer.style.left = horseX + '%';
            horseContainer.style.top = horseY + '%';
            horseContainer.style.transform = 'translate(-50%, -50%)';
            horseSvg.style.transform = 'scaleX(1)';
            horseContainer.style.display = 'block';
            document.getElementById('gameHint').style.display = 'none';
            textInput.value = '';
            committedText = '';
            lastDisplayText = '';
            // 在右侧消息区显示游戏说明
            var existing = document.getElementById('gameInstructions');
            if (existing) existing.remove();
            var instr = document.createElement('div');
            instr.className = 'message-item game-instructions';
            instr.id = 'gameInstructions';
            instr.innerHTML = '🐴 <b>声控小马</b> 🎮<br>━━━━━━━━━━━━━━<br>🎮 进入：说"开始游戏"或"游戏开始"或“游戏”<br>🛑 退出：说"游戏结束"或"结束游戏"<br>⏸️ 暂停：说"暂停"或"停"<br>🎤 语音方向：左/右/上/下<br>⌨️ 键盘方向：← → ↑ ↓<br>🏇 小马持续移动，说新方向即可转向<br>━━━━━━━━━━━━━━<br>💡 同音字自动识别：<br> 左← 走/左/做/座/坐/错/搓…<br> 右→ 有/右/又/由/游/油/友…<br> 上↑ 上/商/伤/尚/赏…<br> 下↓ 下/霞/吓/夏/虾/侠…<br> 停⏸ 暂/停/听/挺/厅/町…';
            messageList.appendChild(instr);
            messageList.scrollTop = messageList.scrollHeight;
            // 启动游戏主循环
            gameLoop();
        }

        function stopGame() {
            if (!gameMode) return;
            gameMode = false;
            currentMoveDir = null;
            if (horseContainer) horseContainer.classList.remove('moving');
            stopHoofbeats();
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null;
            }
            if (gameCanvas) gameCanvas.style.display = 'none';
            if (horseContainer) horseContainer.style.display = 'none';
            var hint = document.getElementById('gameHint');
            if (hint) hint.style.display = 'block';
            textInput.value = '';
            committedText = '';
            lastDisplayText = '';
            lastExecutedDir = '';
            // 移除游戏说明
            var instr = document.getElementById('gameInstructions');
            if (instr) instr.remove();
        }

        function processDirection(text) {
            if (!gameMode) return;
            // 暂停检测：停止移动，保持游戏模式
            var pauseChars = '暂停停听挺厅町';
            for (var i = 0; i < text.length; i++) {
                if (pauseChars.indexOf(text[i]) !== -1) {
                    currentMoveDir = null;
                    if (horseContainer) horseContainer.classList.remove('moving');
                    stopHoofbeats();
                    lastExecutedDir = '';
                    textInput.value = '停';
                    lastDisplayText = '停';
                    return;
                }
            }
            // 从文本中查找方向字符
            var foundDir = null, foundLabel = null;
            for (var d = 0; d < dirChars.length; d++) {
                for (var c = 0; c < text.length; c++) {
                    if (dirChars[d].chars.indexOf(text[c]) !== -1) {
                        foundDir = dirChars[d].dir;
                        foundLabel = dirChars[d].label;
                        break;
                    }
                }
                if (foundDir) break;
            }
            if (!foundDir) return;
            // 连续相同方向：只显示不执行
            if (foundDir === lastExecutedDir) {
                textInput.value = foundLabel;
                lastDisplayText = foundLabel;
                return;
            }
            lastExecutedDir = foundDir;
            textInput.value = foundLabel;
            lastDisplayText = foundLabel;
            // 设置持续移动方向（游戏循环每帧读取）
            currentMoveDir = foundDir;
            // 立即更新朝向
            if (foundDir === 'left') horseFacing = 'left';
            else if (foundDir === 'right') horseFacing = 'right';
            updateHorseTransform(foundDir);
            // 开启行走动画
            horseContainer.classList.add('moving');
            // 启动马蹄声
            startHoofbeats();
        }

        // 游戏主循环：每帧持续移动
        function gameLoop() {
            if (!gameMode) return;
            if (currentMoveDir) {
                var speed = 0.13; // 每帧移动百分比，约 8%/秒@60fps
                switch (currentMoveDir) {
                    case 'left':  horseX -= speed; if (horseX < 5) horseX = 95; break;
                    case 'right': horseX += speed; if (horseX > 95) horseX = 5; break;
                    case 'up':    horseY -= speed; if (horseY < 5) horseY = 95; break;
                    case 'down':  horseY += speed; if (horseY > 95) horseY = 5; break;
                }
                horseContainer.style.left = horseX + '%';
                horseContainer.style.top = horseY + '%';
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // 更新小马 SVG 朝向变换
        function updateHorseTransform(moveDir) {
            var tf = '';
            if (horseFacing === 'left') tf += 'scaleX(-1) ';
            if (moveDir === 'up') tf += 'rotate(-90deg)';
            else if (moveDir === 'down') tf += 'rotate(90deg)';
            horseSvg.style.transform = tf.trim() || 'scaleX(1)';
        }

        // ========== 马蹄声效果（Web Audio API 合成） ==========
        var hoofCtx = null;
        var hoofTimer = null;

        function ensureHoofCtx() {
            if (!hoofCtx) {
                hoofCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (hoofCtx.state === 'suspended') hoofCtx.resume();
        }

        // 单次蹄声：短促噪声 + 带通滤波 + 快速衰减
        function playHoofTick(time) {
            var dur = 0.04;
            var len = Math.ceil(hoofCtx.sampleRate * dur);
            var buf = hoofCtx.createBuffer(1, len, hoofCtx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < len; i++) {
                d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
            }
            var src = hoofCtx.createBufferSource();
            src.buffer = buf;
            var bp = hoofCtx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 900;
            bp.Q.value = 1.5;
            var g = hoofCtx.createGain();
            g.gain.setValueAtTime(0.25, time);
            g.gain.exponentialRampToValueAtTime(0.001, time + dur);
            src.connect(bp).connect(g).connect(hoofCtx.destination);
            src.start(time);
            src.stop(time + dur);
        }

        function startHoofbeats() {
            stopHoofbeats();
            ensureHoofCtx();
            var interval = 280; // 毫秒，配合行走动画 0.25s 周期
            function tick() {
                var t = hoofCtx.currentTime;
                playHoofTick(t);
                playHoofTick(t + 0.1); // 第二拍（对角步态）
            }
            tick();
            hoofTimer = setInterval(tick, interval);
        }

        function stopHoofbeats() {
            if (hoofTimer) {
                clearInterval(hoofTimer);
                hoofTimer = null;
            }
        }

        // ========== 语音识别：延迟重启 + 权限拒绝检测 ==========
        function createRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('当前浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN';
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 3; // 获取3个备选结果，用于置信度择优

            rec.onresult = (event) => {
                let newFinalText = '';
                let interimText = '';
                // 单次遍历同时收集 final 和 interim 结果
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const result = event.results[i];
                    if (result.isFinal) {
                        // 置信度感知选择：优先选高置信度候选
                        let bestTranscript = result[0].transcript;
                        if (result.length > 1) {
                            const topConf = result[0].confidence || 0;
                            if (topConf < 0.7) {
                                for (let j = 1; j < result.length; j++) {
                                    const altConf = result[j].confidence || 0;
                                    if (altConf > topConf) {
                                        bestTranscript = result[j].transcript;
                                    }
                                }
                            }
                        }
                        newFinalText += postProcessChinese(bestTranscript);
                    } else {
                        interimText += result[0].transcript;
                        break;
                    }
                }
                // 方案5：VAD 门控 —— 无语音活动时降低低置信度结果的权重
                if (!isSpeechActive && newFinalText) {
                    // 无语音时，检查识别结果的置信度
                    var hasHighConf = false;
                    for (var ci = event.resultIndex; ci < event.results.length; ci++) {
                        if (event.results[ci].isFinal && (event.results[ci][0].confidence || 0) > 0.6) {
                            hasHighConf = true;
                            break;
                        }
                    }
                    if (!hasHighConf) {
                        // 低置信度 + 无语音活动 → 过滤此结果
                        newFinalText = '';
                    }
                }

                if (newFinalText) {
                    committedText += newFinalText;
                }

                // ===== 游戏命令检测（优先于普通文本处理） =====
                // 取最后一段 final 文本检测命令（避免累积文本干扰）
                const lastSeg = newFinalText || interimText;
                if (lastSeg.indexOf('结束游戏') !== -1 || lastSeg.indexOf('游戏结束') !== -1 || lastSeg.indexOf('结束') !== -1) {
                    stopGame();
                    return;
                }
                if (!gameMode && (lastSeg.indexOf('开始游戏') !== -1 || lastSeg.indexOf('游戏开始') !== -1 || lastSeg.indexOf('游戏') !== -1)) {
                    startGame();
                    return;
                }
                // 游戏模式下的方向检测
                if (gameMode && lastSeg && lastSeg.indexOf('开始游戏') === -1 && lastSeg.indexOf('结束游戏') === -1) {
                    processDirection(lastSeg);
                    return;
                }

                // ===== 普通模式：直接写入文本输入框（无微任务延迟） =====
                if (!gameMode) {
                    const newText = committedText + interimText;
                    if (newText === lastDisplayText) return;
                    lastDisplayText = newText;
                    textInput.value = newText;
                }
            };

            rec.onend = () => {
                // 即时重启：0ms 延迟，识别中断后立刻恢复
                if (shouldListen) {
                    restartTimer = setTimeout(() => {
                        try {
                            rec.start();
                        } catch (e) {
                            try {
                                const newRec = createRecognition();
                                if (!newRec) throw new Error('create failed');
                                recognition = newRec;
                                newRec.start();
                            } catch (e2) {
                                shouldListen = false;
                                audioBtn.classList.remove('active');
                                stopVolumeAnimation();
                            }
                        }
                    }, 0);
                }
            };

            rec.onerror = (event) => {
                console.warn('语音识别错误:', event.error);
                // 方案2：用户拒绝麦克风权限时，立即停止重试，不再重启
                if (event.error === 'not-allowed') {
                    shouldListen = false;
                    if (restartTimer) {
                        clearTimeout(restartTimer);
                        restartTimer = null;
                    }
                    audioBtn.classList.remove('active');
                    stopVolumeAnimation();
                    alert('麦克风权限被拒绝，请在浏览器设置中允许麦克风访问后重试');
                }
                // no-speech、aborted 等错误不中断，onend 会自动延迟重启
            };

            return rec;
        }

        // ========== 麦克风按钮点击 ==========
        audioBtn.addEventListener('click', async () => {
            if (shouldListen) {
                // 停止监听
                shouldListen = false;
                if (restartTimer) {
                    clearTimeout(restartTimer);
                    restartTimer = null;
                }
                if (recognition) {
                    recognition.abort();
                    recognition = null;
                }
                audioBtn.classList.remove('active');
                stopVolumeAnimation();
                stopVADMonitor();
            } else {
                // 开始监听：先获取麦克风（一次弹窗），再启动识别
                try {
                    await preAcquireMic();
                } catch (err) {
                    alert('无法访问麦克风：' + err.message);
                    return;
                }

                shouldListen = true;
                committedText = '';
                recognition = createRecognition();
                if (!recognition) {
                    shouldListen = false;
                    return;
                }

                try {
                    recognition.start();
                } catch (e) {
                    shouldListen = false;
                    return;
                }

                audioBtn.classList.add('active');
                startVolumeAnimation();
                // 方案5：启动 VAD 语音活动检测
                speechIndicator = document.getElementById('speechIndicator');
                if (speechIndicator) speechIndicator.style.display = 'flex';
                noSpeechGateCount = 0;
            }
        });

        // ========== 回车发送消息 ==========
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = textInput.value.trim();
                if (!text) return;

                // 创建消息气泡，靠左显示
                const msgItem = document.createElement('div');
                msgItem.className = 'message-item left';
                msgItem.textContent = text;
                messageList.appendChild(msgItem);

                // 滚动到底部
                messageList.scrollTop = messageList.scrollHeight;

                // 清空输入框和已确认文本
                textInput.value = '';
                committedText = '';
            }
        });

        // ========== 方向键控制小马（游戏模式） ==========
        document.addEventListener('keydown', (e) => {
            if (!gameMode) return;
            const arrowMap = {
                ArrowLeft:  '左',
                ArrowRight: '右',
                ArrowUp:    '上',
                ArrowDown:  '下'
            };
            const label = arrowMap[e.key];
            if (label) {
                e.preventDefault();
                processDirection(label);
            }
        });
    })();
    </script>
