<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 智能 SKILL</title>
<style>
  :root {
    --bg: #050a13;
    --panel: #0a1322;
    --line: rgba(140, 175, 220, 0.14);
    --text: #f2f6fd;
    --text-dim: #8a97ac;
    --accent: #1e9bef;
    --accent-2: #4a5dfe;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 520px at 88% 8%, rgba(16, 148, 176, 0.14), transparent 65%),
      radial-gradient(820px 520px at 8% 96%, rgba(124, 58, 237, 0.12), transparent 65%),
      linear-gradient(rgba(120, 170, 220, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 220, 0.03) 1px, transparent 1px);
    background-size: auto, auto, 64px 64px, 64px 64px;
    font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---------- 顶部栏 ---------- */
  .topbar {
    flex: 0 0 auto;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(8, 16, 28, 0.82);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: linear-gradient(150deg, #e8f4ff 0%, #b9d8f7 45%, #6fa8e8 100%);
    border: 1px solid rgba(255, 255, 255, 0.35);
  }

  .logo span {
    font-size: 14px;
    font-weight: 800;
    background: linear-gradient(140deg, #2a5c9e 0%, #3d7bd0 55%, #6a3ec8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.2px;
  }

  .brand small {
    display: block;
    margin-top: 3px;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.4px;
    color: var(--text-dim);
  }

  .back {
    width: 64px;
    height: 32px;
    padding: 0;
    border-radius: 8px;
    border: 1px solid rgba(140, 175, 220, 0.26);
    background: rgba(30, 48, 74, 0.5);
    color: #d7e3f4;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }

  .back:hover {
    background: rgba(40, 62, 95, 0.72);
    border-color: rgba(90, 170, 240, 0.5);
    color: #ffffff;
  }

  /* ---------- 主体 ---------- */
  .layout {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }

  /* ---------- 左侧目录栏 ---------- */
  .sidebar {
    flex: 0 0 290px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(10, 20, 34, 0.9), rgba(7, 14, 26, 0.92));
  }

  .search {
    flex: 0 0 auto;
    position: relative;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
  }

  .search svg {
    position: absolute;
    left: 29px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    stroke: #7f8ea3;
    pointer-events: none;
  }

  .search input {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 34px;
    border-radius: 8px;
    border: 1px solid rgba(140, 175, 220, 0.2);
    background: rgba(10, 20, 34, 0.9);
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .search input::placeholder { color: #62718a; }

  .search input:focus {
    border-color: rgba(74, 93, 254, 0.75);
    background: rgba(12, 24, 42, 0.95);
    box-shadow: 0 0 0 3px rgba(74, 93, 254, 0.14);
  }

  .dir-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px;
  }

  .dir-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 11px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: #c6d2e4;
    font-family: inherit;
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    transition: background 0.16s, border-color 0.16s, color 0.16s;
  }

  .dir-item svg {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    stroke: #6f8bb0;
  }

  .dir-item .name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .dir-item:hover {
    background: rgba(40, 62, 95, 0.45);
    border-color: rgba(90, 170, 240, 0.22);
    color: #ffffff;
  }

  .dir-item.active {
    background: linear-gradient(90deg, rgba(30, 155, 239, 0.2), rgba(74, 93, 254, 0.12));
    border-color: rgba(90, 170, 240, 0.45);
    color: #ffffff;
  }

  .dir-item.active svg { stroke: #6fc4ff; }

  .dir-item.no-readme { color: #7d8899; }

  .dir-item mark {
    background: rgba(30, 155, 239, 0.28);
    color: #bfe7ff;
    border-radius: 2px;
  }

  .list-tip {
    padding: 14px 8px;
    font-size: 12px;
    color: #6f7d92;
    text-align: center;
  }

  /* ---------- 右侧内容区 ---------- */
  .content {
    flex: 1 1 auto;
    min-width: 0;
    overflow-y: auto;
    padding: 30px 40px 60px;
  }

  .doc {
    max-width: 860px;
    margin: 0 auto;
  }

  .doc-title {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }

  .doc-title h2 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.6px;
    overflow-wrap: anywhere;
  }

  .doc-title span {
    flex: 0 0 auto;
    padding: 3px 9px;
    border: 1px solid rgba(110, 195, 245, 0.34);
    border-radius: 999px;
    font-size: 10.5px;
    color: #a8d7f7;
    background: rgba(40, 150, 220, 0.08);
  }

  /* Markdown 排版 */
  .markdown { font-size: 13.5px; line-height: 1.85; color: #cfdae9; overflow-wrap: anywhere; }

  .markdown h1, .markdown h2, .markdown h3,
  .markdown h4, .markdown h5, .markdown h6 {
    margin: 26px 0 12px;
    color: #ffffff;
    font-weight: 700;
    line-height: 1.4;
  }

  .markdown h1 { font-size: 23px; }
  .markdown h2 { font-size: 19px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .markdown h3 { font-size: 16px; }
  .markdown h4, .markdown h5, .markdown h6 { font-size: 14px; }

  .markdown > *:first-child { margin-top: 0; }

  .markdown p { margin: 12px 0; }

  .markdown a { color: #5bc0ff; text-decoration: none; }
  .markdown a:hover { text-decoration: underline; }

  .markdown strong { color: #ffffff; }
  .markdown del { color: #7e8a9c; }

  .markdown code {
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(120, 175, 235, 0.13);
    border: 1px solid rgba(120, 175, 235, 0.16);
    font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    font-size: 12.5px;
    color: #9fd7ff;
  }

  .markdown pre {
    margin: 14px 0;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(140, 175, 220, 0.16);
    background: rgba(5, 11, 20, 0.92);
    overflow-x: auto;
  }

  .markdown pre code {
    padding: 0;
    border: none;
    background: transparent;
    color: #c9e4ff;
    font-size: 12.5px;
    line-height: 1.7;
  }

  .markdown ul, .markdown ol { margin: 12px 0 12px 22px; }
  .markdown li { margin: 5px 0; }
  .markdown li > ul, .markdown li > ol { margin: 5px 0 5px 18px; }

  .markdown blockquote {
    margin: 14px 0;
    padding: 10px 16px;
    border-left: 3px solid rgba(30, 155, 239, 0.6);
    border-radius: 0 8px 8px 0;
    background: rgba(30, 155, 239, 0.07);
    color: #a9bbd2;
  }

  .markdown blockquote p { margin: 4px 0; }

  .markdown hr {
    height: 1px;
    margin: 24px 0;
    border: none;
    background: var(--line);
  }

  .markdown table {
    width: 100%;
    margin: 16px 0;
    border-collapse: collapse;
    font-size: 12.5px;
  }

  .markdown th, .markdown td {
    padding: 8px 12px;
    border: 1px solid rgba(140, 175, 220, 0.16);
    text-align: left;
    vertical-align: top;
  }

  .markdown th {
    background: rgba(30, 60, 96, 0.42);
    color: #ffffff;
    font-weight: 600;
    white-space: nowrap;
  }

  .markdown tr:nth-child(even) td { background: rgba(20, 38, 62, 0.22); }

  .markdown img {
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
  }

  /* 占位 / 状态 */
  .placeholder {
    height: 100%;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #6f7d92;
    font-size: 13px;
    text-align: center;
  }

  .placeholder[hidden],
  .doc[hidden] { display: none; }

  .placeholder svg { width: 40px; height: 40px; stroke: #3d4d63; }

  .placeholder.error { color: #ff8f9a; }

  .content::-webkit-scrollbar,
  .dir-list::-webkit-scrollbar { width: 8px; }

  .content::-webkit-scrollbar-thumb,
  .dir-list::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background: rgba(120, 160, 210, 0.2);
  }

  /* ---------- 顶栏下载按钮 ---------- */
  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 64px;
    height: 32px;
    padding: 0 6px;
    border: 1px solid rgba(74, 93, 254, 0.45);
    border-radius: 8px;
    background: rgba(74, 93, 254, 0.14);
    color: #cfe0ff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }

  .download-btn svg {
    width: 13px;
    height: 13px;
    flex: 0 0 auto;
    stroke: currentColor;
  }

  .download-btn:hover:not(:disabled) {
    background: rgba(74, 93, 254, 0.26);
    border-color: rgba(120, 140, 255, 0.75);
    color: #ffffff;
  }

  .download-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .download-tip {
    max-width: 220px;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .download-tip.error { color: #ff5c70; }

  @media (max-width: 820px) {
    body { overflow: auto; }
    .layout { flex-direction: column; }
    .sidebar {
      flex: 0 0 auto;
      max-height: 44vh;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .content { padding: 22px 18px 48px; }
    .download-tip { display: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span>AI</span></div>
      <div>
        <h1>AI 智能 SKILL</h1>
        <small>Skill 目录与 README.MD 预览</small>
      </div>
    </div>
    <div class="top-actions">
      <span class="download-tip" id="downloadTip"></span>
      <button type="button" class="download-btn" id="downloadBtn" disabled title="请先选择左侧目录">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"></path>
          <path d="M7 10l5 5 5-5"></path>
          <path d="M4 21h16"></path>
        </svg>
        <span>下载</span>
      </button>
      <button type="button" class="back" id="backBtn">返回</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索目录名称" autocomplete="off" />
      </div>
      <div class="dir-list" id="dirList"></div>
    </aside>

    <main class="content">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 3v5h5"></path>
          <line x1="9" y1="13" x2="15" y2="13"></line>
          <line x1="9" y1="17" x2="13" y2="17"></line>
        </svg>
        <span>请选择左侧目录查看 README.MD</span>
      </div>
      <article class="doc" id="doc" hidden>
        <div class="doc-title">
          <h2 id="docName"></h2>
          <span>README.MD</span>
        </div>
        <div class="markdown" id="markdown"></div>
      </article>
    </main>
  </div>

<script>
(function () {
  var dirList = document.getElementById("dirList");
  var searchInput = document.getElementById("searchInput");
  var placeholder = document.getElementById("placeholder");
  var doc = document.getElementById("doc");
  var docName = document.getElementById("docName");
  var markdownEl = document.getElementById("markdown");
  var downloadBtn = document.getElementById("downloadBtn");
  var downloadTip = document.getElementById("downloadTip");
  var downloading = false;

  var state = {
    items: [],
    keyword: "",
    selected: "",
    requestId: 0
  };

  /* ---------- Markdown 渲染 ---------- */
  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function assetUrl(src) {
    if (/^(https?:)?\/\//i.test(src) || /^data:/i.test(src) || src.charAt(0) === "#") {
      return src;
    }
    var clean = src.replace(/^\.\//, "");
    return "api.php?action=skillFile&name=" + encodeURIComponent(state.selected) +
      "&path=" + encodeURIComponent(clean);
  }

  function safeUrl(url) {
    if (/^\s*javascript:/i.test(url)) {
      return "#";
    }
    return url;
  }

  function renderInline(text) {
    var s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, function (_, code) {
      return "<code>" + code + "</code>";
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, function (_, alt, src) {
      return '<img src="' + assetUrl(src) + '" alt="' + alt + '" />';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, function (_, label, href) {
      return '<a href="' + safeUrl(href) + '" target="_blank" rel="noopener">' + label + "</a>";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    return s;
  }

  function splitRow(line) {
    var s = line.trim();
    if (s.charAt(0) === "|") s = s.slice(1);
    if (s.charAt(s.length - 1) === "|") s = s.slice(0, -1);
    return s.split("|").map(function (cell) { return cell.trim(); });
  }

  function renderMarkdown(source) {
    var lines = String(source).replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var paragraph = [];
    var i = 0;

    function flushParagraph() {
      if (paragraph.length) {
        out.push("<p>" + renderInline(paragraph.join(" ")) + "</p>");
        paragraph = [];
      }
    }

    while (i < lines.length) {
      var line = lines[i];

      var fence = line.match(/^\s*```(\S*)\s*$/);
      if (fence) {
        flushParagraph();
        var lang = fence[1] || "";
        var buffer = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
          buffer.push(lines[i]);
          i++;
        }
        i++;
        out.push('<pre><code' + (lang ? ' class="language-' + escapeHtml(lang) + '"' : "") +
          ">" + escapeHtml(buffer.join("\n")) + "</code></pre>");
        continue;
      }

      if (/^\s*$/.test(line)) {
        flushParagraph();
        i++;
        continue;
      }

      var heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        flushParagraph();
        var level = heading[1].length;
        out.push("<h" + level + ">" + renderInline(heading[2].trim()) + "</h" + level + ">");
        i++;
        continue;
      }

      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
        flushParagraph();
        out.push("<hr />");
        i++;
        continue;
      }

      if (/^\s*>/.test(line)) {
        flushParagraph();
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quote.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + renderMarkdown(quote.join("\n")) + "</blockquote>");
        continue;
      }

      if (line.indexOf("|") !== -1 && i + 1 < lines.length &&
          /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
        flushParagraph();
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        var table = "<table><thead><tr>";
        head.forEach(function (cell) { table += "<th>" + renderInline(cell) + "</th>"; });
        table += "</tr></thead><tbody>";
        rows.forEach(function (row) {
          table += "<tr>";
          head.forEach(function (_, idx) {
            table += "<td>" + renderInline(row[idx] || "") + "</td>";
          });
          table += "</tr>";
        });
        table += "</tbody></table>";
        out.push(table);
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) {
        flushParagraph();
        var ul = [];
        while (i < lines.length) {
          var ulMatch = lines[i].match(/^\s*[-*+]\s+(.*)$/);
          if (!ulMatch) break;
          ul.push(ulMatch[1]);
          i++;
        }
        out.push("<ul>" + ul.map(function (item) {
          return "<li>" + renderInline(item) + "</li>";
        }).join("") + "</ul>");
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        flushParagraph();
        var ol = [];
        while (i < lines.length) {
          var olMatch = lines[i].match(/^\s*\d+\.\s+(.*)$/);
          if (!olMatch) break;
          ol.push(olMatch[1]);
          i++;
        }
        out.push("<ol>" + ol.map(function (item) {
          return "<li>" + renderInline(item) + "</li>";
        }).join("") + "</ol>");
        continue;
      }

      paragraph.push(line.trim());
      i++;
    }

    flushParagraph();
    return out.join("\n");
  }

  /* ---------- 目录列表 ---------- */
  function syncDownloadState() {
    downloadBtn.disabled = downloading || !state.selected;
    downloadBtn.title = state.selected
      ? "下载 " + state.selected + ".zip"
      : "请先选择左侧目录";
  }

  function highlight(name, keyword) {
    if (!keyword) {
      return escapeHtml(name);
    }
    var index = name.toLowerCase().indexOf(keyword);
    if (index === -1) {
      return escapeHtml(name);
    }
    return escapeHtml(name.slice(0, index)) +
      "<mark>" + escapeHtml(name.slice(index, index + keyword.length)) + "</mark>" +
      escapeHtml(name.slice(index + keyword.length));
  }

  /* 目录排序：先排 3 位数字开头的目录，再排 4 位数字开头的目录，同类内按字典序 */
  function skillNameRank(name) {
    var match = /^\d+/.exec(String(name));
    if (match && match[0].length === 3) return 0;
    if (match && match[0].length === 4) return 1;
    return 2;
  }

  function compareSkillName(a, b) {
    var rankDiff = skillNameRank(a.name) - skillNameRank(b.name);
    if (rankDiff !== 0) return rankDiff;
    return String(a.name).localeCompare(String(b.name), "zh-CN");
  }

  function renderList() {
    syncDownloadState();
    var keyword = state.keyword.trim().toLowerCase();
    var visible = state.items.filter(function (item) {
      return keyword === "" || item.name.toLowerCase().indexOf(keyword) !== -1;
    });

    dirList.innerHTML = "";

    if (!visible.length) {
      var tip = document.createElement("div");
      tip.className = "list-tip";
      tip.textContent = state.items.length ? "未找到匹配的目录" : "暂无 Skill 目录";
      dirList.appendChild(tip);
      return;
    }

    visible.forEach(function (item) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dir-item" +
        (item.name === state.selected ? " active" : "") +
        (item.hasReadme ? "" : " no-readme");
      btn.title = item.name + (item.hasReadme ? "" : "（无 README.MD）");
      btn.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 7a2 2 0 0 1 2-2h3.5l2 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>' +
        "</svg>" +
        '<span class="name">' + highlight(item.name, keyword) + "</span>";
      btn.addEventListener("click", function () {
        selectSkill(item.name);
      });
      dirList.appendChild(btn);
    });
  }

  function showPlaceholder(message, isError) {
    doc.hidden = true;
    placeholder.hidden = false;
    placeholder.classList.toggle("error", !!isError);
    placeholder.querySelector("span").textContent = message;
  }

  function selectSkill(name) {
    state.selected = name;
    state.requestId += 1;
    var currentRequest = state.requestId;

    if (!downloading) {
      downloadTip.textContent = "";
      downloadTip.classList.remove("error");
    }

    renderList();
    showPlaceholder("正在加载 README.MD…", false);

    fetch("api.php?action=skillReadme&name=" + encodeURIComponent(name))
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (currentRequest !== state.requestId) return;
        if (res && res.code === 0 && res.data) {
          docName.textContent = name;
          markdownEl.innerHTML = renderMarkdown(res.data.content || "");
          placeholder.hidden = true;
          doc.hidden = false;
          document.querySelector(".content").scrollTop = 0;
        } else {
          showPlaceholder((res && res.message) || "README.MD 读取失败", true);
        }
      })
      .catch(function () {
        if (currentRequest !== state.requestId) return;
        showPlaceholder("网络异常，请稍后重试", true);
      });
  }

  function loadSkills() {
    showPlaceholder("正在加载目录…", false);
    fetch("api.php?action=listSkills")
      .then(function (res) { return res.json(); })
      .then(function (res) {
        if (res && res.code === 0 && res.data && Array.isArray(res.data.items)) {
          state.items = res.data.items.slice().sort(compareSkillName);
          renderList();
          if (state.items.length) {
            selectSkill(state.items[0].name);
          } else {
            showPlaceholder("Skill 目录下暂无子目录", true);
          }
        } else {
          showPlaceholder((res && res.message) || "目录加载失败", true);
        }
      })
      .catch(function () {
        showPlaceholder("网络异常，请稍后重试", true);
      });
  }

  searchInput.addEventListener("input", function () {
    state.keyword = searchInput.value;
    renderList();
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    window.location.href = "portal.html";
  });

  downloadBtn.addEventListener("click", function () {
    if (downloading || !state.selected) return;

    var name = state.selected;
    downloading = true;
    syncDownloadState();
    downloadTip.classList.remove("error");
    downloadTip.textContent = "正在打包 " + name + ".zip …";

    fetch("api.php?action=downloadSkill&name=" + encodeURIComponent(name))
      .then(function (res) {
        var type = res.headers.get("Content-Type") || "";
        if (type.indexOf("application/zip") === -1) {
          return res.text().then(function (text) {
            var message = "打包下载失败，请稍后重试";
            try {
              var data = JSON.parse(text);
              if (data && data.message) message = data.message;
            } catch (e) {}
            throw new Error(message);
          });
        }
        return res.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = name + ".zip";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        downloadTip.textContent = "已下载 " + name + ".zip";
      })
      .catch(function (err) {
        downloadTip.classList.add("error");
        downloadTip.textContent = (err && err.message) || "打包下载失败，请稍后重试";
      })
      .finally(function () {
        downloading = false;
        syncDownloadState();
      });
  });

  loadSkills();
})();
</script>
</body>
</html>
