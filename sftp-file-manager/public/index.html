<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFTP文件管理器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 50vh;
            padding: 10px;
            overflow-x: auto;
        }
        html, body {
            width: 100%;
            min-width: 1380px;
        }
        .container {
            width: 1380px;
            max-width: 1380px;
            min-width: 1380px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .connection-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            height: 130px;
        }
        .connection-panel h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
            margin-top: -15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            margin-top: 20px;
        }
        .form-group {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            vertical-align: top;
        }
        .form-group.host-group {
            width: 180px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 13px;
        }
        .form-group input {
            width: 160px;
            height: 38px;
            min-width: 160px;
            max-width: 160px;
            min-height: 38px;
            max-height: 38px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        #port {
            width: 160px;
            height: 38px;
        }
        div.form-group.port-group {
            margin-left: -10px !important;
        }
        .form-group.button-group {
            display: inline-block;
            vertical-align: top;
            margin-left: 10px;
            margin-top: 24px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-row {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            height: 40px;
            min-height: 40px;
            max-height: 40px;
            line-height: 1;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 5px;
        }
        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .main-content {
            display: grid;
            grid-template-columns: 680px 680px;
            gap: 20px;
            width: 1380px;
            min-width: 1380px;
            max-width: 1380px;
        }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            width: 680px;
            min-width: 680px;
            max-width: 680px;
        }
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .panel-header h3 {
            color: #333;
            font-size: 1.1rem;
        }
        .panel-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .file-list {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }
        .file-list-header {
            display: grid;
            grid-template-columns: 40px 1fr 100px 160px;
            gap: 10px;
            padding: 10px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .file-list-header span {
            cursor: pointer;
            user-select: none;
        }
        .file-list-header span:hover {
            color: #667eea;
        }
        .file-item {
            display: grid;
            grid-template-columns: 40px 1fr 100px 160px;
            gap: 10px;
            padding: 8px 15px;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #f0f0f0;
            height: 70px;
            min-height: 70px;
            max-height: 70px;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item:hover {
            background: #f5f7ff;
        }
        .file-item.selected {
            background: #e8f0fe;
        }
        .file-item.directory {
            background: #fafafa;
        }
        .file-item.directory:hover {
            background: #f0f4ff;
        }
        .file-item.directory.selected {
            background: #e3f2fd;
        }
        .file-item .icon {
            font-size: 1.3rem;
            text-align: center;
        }
        .file-item .name {
            font-weight: 500;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item.directory .name {
            color: #1a73e8;
        }
        .file-item .size {
            font-size: 12px;
            color: #666;
            text-align: right;
        }
        .file-item.directory .size {
            color: #999;
        }
        .file-item .date {
            font-size: 12px;
            color: #888;
        }
        .file-item .actions {
            display: flex;
            gap: 5px;
            justify-content: flex-end;
        }
        .file-status-bar {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }
        .file-status-bar .count {
            font-weight: 500;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #888;
            height: 350px;
        }
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            color: #666;
            font-size: 12px;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 6px;
            word-break: break-all;
            height: 40px;
            margin-top: 5px;
        }
        .breadcrumb-item {
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
        }
        .breadcrumb-item:hover {
            text-decoration: underline;
        }
        .breadcrumb-separator {
            color: #ccc;
        }
        .file-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .file-item.selected {
            background-color: #e8f0fe;
            border-color: #667eea;
        }
        .file-item .actions {
            display: flex;
            gap: 5px;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
            height: 40px;
            min-height: 40px;
            max-height: 40px;
            white-space: nowrap;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-secondary:disabled {
            background-color: #c8c8c8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📂 SFTP文件管理器</h1>

        <div class="connection-panel">
            <h2>🔐 SFTP连接</h2>

            <div class="form-row">
                <div class="form-group host-group">
                    <label for="host">🖥️ SFTP服务器地址</label>
                    <input type="text" id="host" placeholder="例如: www.studytech.cloud">
                </div>
                <div class="form-group port-group">
                    <label for="port">🔌 端口 </label>
                    <input type="number" id="port" placeholder="默认: 22" value="22">
                </div>
                <div class="form-group">
                    <label for="username">👤 用户名</label>
                    <input type="text" id="username" placeholder="例如: root">
                </div>
                <div class="form-group">
                    <label for="password">🔑 密码</label>
                    <input type="password" id="password" placeholder="输入密码">
                </div>
                <div class="form-group button-group">
                    <button class="btn btn-primary" id="toggleBtn" onclick="toggleConnection()">连接</button>
                    <div class="status-bar" style="display: inline-block; margin-left: 15px; vertical-align: middle;">
                        <span class="status disconnected" id="connectionStatus">未连接</span>
                        <span id="serverInfo" style="color: #666; font-size: 12px;"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-header">
                    <h3>🖥️ 服务器文件</h3>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" id="serverGoUpBtn" onclick="goUpServerDirectory()" disabled>⬆️ 上级目录</button>
                        <button class="btn btn-secondary" id="refreshServerBtn" onclick="refreshServerDirectory()">🔄 刷新</button>
                        <button class="btn btn-success" id="downloadBtn" disabled onclick="downloadSelectedFile()">下载</button>
                    </div>
                </div>
                <div class="breadcrumb" id="serverBreadcrumb"></div>
                <div class="file-list" id="serverFileList">
                    <div class="file-list-header">
                        <span></span>
                        <span onclick="sortServerFiles('name')">名称 ↕</span>
                        <span onclick="sortServerFiles('size')">大小</span>
                        <span onclick="sortServerFiles('date')">修改时间</span>
                    </div>
                    <div class="empty-message">请先连接服务器</div>
                </div>
                <div class="file-status-bar">
                    <span class="count" id="serverFileCount">0 项目</span>
                    <span id="serverSelectedInfo"></span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3>💻 本地文件</h3>
                    <div class="panel-actions">
                        <button class="btn btn-primary" id="selectLocalBtn" onclick="selectLocalDirectory()">📁 选择本地文件夹</button>
                        <button class="btn btn-secondary" id="goUpBtn" onclick="goUpDirectory()" disabled>⬆️ 上级目录</button>
                        <button class="btn btn-secondary" id="refreshBtn" onclick="refreshLocalDirectory()" disabled>🔄 刷新</button>
                        <button class="btn btn-success" id="uploadBtn" disabled onclick="uploadFiles()">上传</button>
                    </div>
                </div>
                <div class="breadcrumb" id="localBreadcrumb"></div>
                <div class="file-list" id="localFileList">
                    <div class="file-list-header">
                        <span></span>
                        <span onclick="sortLocalFiles('name')">名称 ↕</span>
                        <span onclick="sortLocalFiles('size')">大小</span>
                        <span></span>
                    </div>
                    <div class="empty-message">
                        <p>请点击本地面板任意位置，选择要浏览的本地文件夹</p>
                    </div>
                </div>
                <div class="file-status-bar">
                    <span class="count" id="localFileCount">0 项目</span>
                    <span id="localSelectedInfo"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let API_HOST = '';
        let backendStatus = false;
        const DEFAULT_SFTP_PORT = 22;

        const toggleBtn = document.getElementById('toggleBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const serverFileList = document.getElementById('serverFileList');
        const localFileList = document.getElementById('localFileList');
        const downloadBtn = document.getElementById('downloadBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const portInput = document.getElementById('port');

        let isConnected = false;
        let currentServerPath = '/';
        let currentLocalPath = '';
        let currentLocalDirHandle = null;
        let localPathHistory = [];
        let selectedServerFile = null;
        let selectedLocalFiles = [];
        let selectedLocalEntries = [];
        let localFilesToUpload = [];

        portInput.value = DEFAULT_SFTP_PORT;

        document.getElementById('refreshServerBtn').disabled = true;
        document.getElementById('serverGoUpBtn').disabled = true;

        async function init() {
            await loadConfig();
            checkBackendStatus();
            setInterval(checkBackendStatus, 5000);
            
            document.getElementById('localFileList').addEventListener('click', (e) => {
                if (currentLocalPath === '') {
                    selectLocalDirectory();
                }
            });
        }

        async function loadConfig() {
            try {
                console.log('[Config] Fetching config from: /api/config');
                const response = await fetch('/api/config');
                console.log('[Config] Response status:', response.status);
                const data = await response.json();
                console.log('[Config] Response data:', JSON.stringify(data));

                let loadedApiHost = null;

                if (data.success && data.config) {
                    loadedApiHost = data.config.apiHost;
                    console.log('[Config] Loaded apiHost from server:', loadedApiHost);

                    if (data.config.defaultServerIP) {
                        document.getElementById('host').value = data.config.defaultServerIP;
                        console.log('[Config] defaultServerIP set to:', data.config.defaultServerIP);
                    }

                    if (data.config.defaultPort && data.config.defaultPort !== 3000) {
                        portInput.value = data.config.defaultPort;
                        console.log('[Config] defaultPort set to:', data.config.defaultPort);
                    }
                } else {
                    console.log('[Config] Config load failed or invalid format');
                }

                if (loadedApiHost && loadedApiHost.trim() !== '') {
                    API_HOST = loadedApiHost.endsWith('/')
                        ? loadedApiHost.slice(0, -1)
                        : loadedApiHost;
                    console.log('[Config] API_HOST final value (from config):', API_HOST);
                } else {
                    const origin = window.location.origin;
                    const port = window.location.port;
                    if (!port || port === '80' || port === '443') {
                        API_HOST = origin + ':3000';
                    } else {
                        API_HOST = origin + ':3000';
                    }
                    console.log('[Config] API_HOST final value (fallback):', API_HOST);
                }
            } catch (error) {
                console.error('[Config] Load config failed:', error);
                const origin = window.location.origin;
                const port = window.location.port;
                if (!port || port === '80' || port === '443') {
                    API_HOST = origin + ':3000';
                } else {
                    API_HOST = origin;
                }
                console.log('[Config] API_HOST final value (exception):', API_HOST);
            }
        }

        async function toggleConnection() {
            if (isConnected) {
                await disconnectServer();
            } else {
                await connectToServer();
            }
        }

        async function connectToServer() {
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!host) {
                alert('请填写SFTP服务器地址');
                return;
            }
            if (!username) {
                alert('请填写用户名');
                return;
            }

            try {
                console.log('[Connect] Sending request to:', API_HOST + '/api/connect');
                const response = await fetch(API_HOST + '/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ host, port, username, password })
                });

                console.log('[Connect] Response status:', response.status);

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('[Connect] Non-JSON response:', text);
                    throw new Error('服务器返回错误: ' + response.status + '\n\n可能原因：\n1. 后端服务未启动\n2. API地址配置错误\n3. 端口被占用\n\n当前API地址: ' + API_HOST);
                }

                const data = await response.json();
                console.log('[Connect] Response data:', data);

                if (data.success) {
                    isConnected = true;
                    connectionStatus.textContent = '已连接';
                    connectionStatus.className = 'status connected';
                    toggleBtn.textContent = '断开';
                    toggleBtn.className = 'btn btn-danger';
                    document.getElementById('serverInfo').textContent = host + ':' + (port || DEFAULT_SFTP_PORT);
                    document.getElementById('refreshServerBtn').disabled = false;
                    await loadServerFiles('/');
                } else {
                    let errorMsg = '连接失败: ' + data.message;
                    if (data.suggestion) {
                        errorMsg += '\n\n💡 ' + data.suggestion;
                    }
                    if (data.errorCode) {
                        errorMsg += '\n\n错误代码: ' + data.errorCode;
                    }
                    if (response.status === 404) {
                        errorMsg = '服务器返回404错误\n\n💡 ' + (data.suggestion || '请确认后端服务已在服务器上启动');
                        errorMsg += '\n\n当前API地址: ' + API_HOST;
                    }
                    alert(errorMsg);
                }
            } catch (error) {
                console.error('[Connect] Error:', error);
                alert('连接失败: ' + error.message + '\n\n请检查：\n1. 后端服务是否已启动\n2. config.json中apiHost配置是否正确\n3. 服务器防火墙是否开放了端口');
            }
        }

        async function disconnectServer() {
            try {
                await fetch(API_HOST + '/api/disconnect', { method: 'POST' });
                isConnected = false;
                connectionStatus.textContent = '未连接';
                connectionStatus.className = 'status disconnected';
                toggleBtn.textContent = '连接';
                toggleBtn.className = 'btn btn-primary';
                document.getElementById('serverInfo').textContent = '';
                document.getElementById('refreshServerBtn').disabled = true;
                document.getElementById('serverGoUpBtn').disabled = true;
                serverFileList.innerHTML = '<div class="empty-message">请先连接服务器</div>';
            } catch (error) {
                alert('断开连接失败: ' + error.message);
            }
        }

        async function loadServerFiles(path) {
            try {
                const response = await fetch(API_HOST + '/api/list?path=' + encodeURIComponent(path));
                const data = await response.json();

                if (data.success) {
                    currentServerPath = path;
                    renderServerFiles(data.files);
                    updateServerBreadcrumb(path);
                    document.getElementById('serverGoUpBtn').disabled = (path === '/');
                } else {
                    alert('加载文件失败: ' + data.message);
                }
            } catch (error) {
                alert('加载文件失败: ' + error.message);
            }
        }

        let serverFilesData = [];
        let serverSortField = 'name';
        let serverSortAsc = true;

        function renderServerFiles(files) {
            serverFilesData = files;
            
            const header = serverFileList.querySelector('.file-list-header');
            serverFileList.innerHTML = '';
            if (header) serverFileList.appendChild(header);

            if (files.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.textContent = '文件夹为空';
                serverFileList.appendChild(emptyDiv);
                document.getElementById('serverFileCount').textContent = '0 项目';
                return;
            }

            const sortedFiles = sortFiles(files, serverSortField, serverSortAsc);

            sortedFiles.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item' + (file.type === 'd' ? ' directory' : '');
                fileItem.dataset.path = file.type === 'd' 
                    ? (currentServerPath === '/' ? '/' + file.name : currentServerPath + '/' + file.name)
                    : file.name;

                const icon = file.type === 'd' ? '📁' : '📄';
                const size = file.type === 'd' ? '-' : formatSize(file.size);
                const date = file.modifyTime ? new Date(file.modifyTime).toLocaleString() : '-';

                fileItem.innerHTML = `
                    <span class="icon">${icon}</span>
                    <span class="name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
                    <span class="size">${size}</span>
                    <span class="date">${date}</span>
                `;

                if (file.type === 'd') {
                    fileItem.addEventListener('dblclick', () => {
                        loadServerFiles(fileItem.dataset.path);
                    });
                    fileItem.addEventListener('click', () => {
                        clearServerSelection();
                    });
                } else {
                    fileItem.addEventListener('click', (e) => {
                        toggleServerFileSelection(file, fileItem);
                    });
                    fileItem.addEventListener('dblclick', () => {
                        toggleServerFileSelection(file, fileItem);
                    });
                }

                serverFileList.appendChild(fileItem);
            });

            document.getElementById('serverFileCount').textContent = files.length + ' 项目';
        }

        function sortFiles(files, field, asc) {
            const dirs = files.filter(f => f.type === 'd');
            const regularFiles = files.filter(f => f.type !== 'd');
            
            const sortFn = (a, b) => {
                if (field === 'name') {
                    return asc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                } else if (field === 'size') {
                    return asc ? (a.size || 0) - (b.size || 0) : (b.size || 0) - (a.size || 0);
                } else if (field === 'date') {
                    return asc ? (a.modifyTime || 0) - (b.modifyTime || 0) : (b.modifyTime || 0) - (a.modifyTime || 0);
                }
                return 0;
            };
            
            dirs.sort(sortFn);
            regularFiles.sort(sortFn);
            
            return [...dirs, ...regularFiles];
        }

        function sortServerFiles(field) {
            if (serverSortField === field) {
                serverSortAsc = !serverSortAsc;
            } else {
                serverSortField = field;
                serverSortAsc = true;
            }
            renderServerFiles(serverFilesData);
        }

        function clearServerSelection() {
            selectedServerFile = null;
            downloadBtn.disabled = true;
            document.querySelectorAll('#serverFileList .file-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.getElementById('serverSelectedInfo').textContent = '';
        }

        function toggleServerFileSelection(file, fileItem) {
            const filePath = currentServerPath === '/' ? '/' + file.name : currentServerPath + '/' + file.name;
            
            if (selectedServerFile && selectedServerFile.path === filePath) {
                selectedServerFile = null;
                downloadBtn.disabled = true;
                fileItem.classList.remove('selected');
                document.getElementById('serverSelectedInfo').textContent = '';
            } else {
                clearServerSelection();
                selectedServerFile = { path: filePath, name: file.name };
                downloadBtn.disabled = false;
                fileItem.classList.add('selected');
                document.getElementById('serverSelectedInfo').textContent = '已选择: ' + file.name;
            }
        }

        function goUpServerDirectory() {
            if (currentServerPath === '/') return;
            
            const parts = currentServerPath.split('/').filter(p => p);
            parts.pop();
            const parentPath = parts.length > 0 ? '/' + parts.join('/') : '/';
            currentServerPath = parentPath;
            loadServerFiles(currentServerPath);
        }

        function refreshServerDirectory() {
            if (isConnected) {
                loadServerFiles(currentServerPath);
            }
        }

        function updateServerBreadcrumb(path) {
            const breadcrumb = document.getElementById('serverBreadcrumb');
            breadcrumb.innerHTML = '';

            const parts = path.split('/').filter(p => p);
            let currentPath = '';

            const rootItem = document.createElement('span');
            rootItem.className = 'breadcrumb-item';
            rootItem.textContent = '根目录';
            rootItem.addEventListener('click', () => loadServerFiles('/'));
            breadcrumb.appendChild(rootItem);

            parts.forEach((part, index) => {
                currentPath += '/' + part;

                const separator = document.createElement('span');
                separator.className = 'breadcrumb-separator';
                separator.textContent = ' > ';
                breadcrumb.appendChild(separator);

                const item = document.createElement('span');
                item.className = 'breadcrumb-item';
                item.textContent = part;
                const pathCopy = currentPath;
                item.addEventListener('click', () => loadServerFiles(pathCopy));
                breadcrumb.appendChild(item);
            });
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function downloadSelectedFile() {
            if (!selectedServerFile) {
                alert('请先选择要下载的服务器文件\n\n在左侧服务器文件列表中点击选择文件');
                return;
            }
            
            if (!currentLocalDirHandle) {
                alert('请先选择本地保存位置\n\n步骤：\n1. 点击右侧的「📁 选择本地文件夹」按钮\n2. 在弹出的文件选择器中选择一个文件夹\n3. 然后再点击下载');
                return;
            }
            
            try {
                const downloadUrl = API_HOST + '/api/download?path=' + encodeURIComponent(selectedServerFile.path);
                console.log('正在下载文件:', selectedServerFile.path);
                console.log('下载URL:', downloadUrl);
                
                const response = await fetch(downloadUrl, {
                    credentials: 'include'
                });
                
                console.log('响应状态:', response.status);
                console.log('响应类型:', response.type);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('服务器错误:', errorText);
                    throw new Error('下载失败 (HTTP ' + response.status + '): ' + response.statusText);
                }
                
                const blob = await response.blob();
                console.log('文件大小:', blob.size, 'bytes');
                
                if (blob.size === 0) {
                    throw new Error('下载的文件为空');
                }
                
                const fileHandle = await currentLocalDirHandle.getFileHandle(selectedServerFile.name, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
                
                alert('✓ 文件已成功下载到:\n' + selectedServerFile.name);
                refreshLocalDirectory();
                
            } catch (err) {
                console.error('下载过程出错:', err);
                alert('下载文件失败!\n\n错误信息: ' + err.message + '\n\n请检查:\n1. 服务器连接是否正常\n2. 文件是否存在\n3. 浏览器控制台(F12)的详细错误信息');
            }
        }

        async function selectLocalDirectory() {
            try {
                if (window.showDirectoryPicker) {
                    const dirHandle = await window.showDirectoryPicker();
                    currentLocalDirHandle = dirHandle;
                    
                    let fullPath = await getFullPath(dirHandle);
                    
                    if (!fullPath.startsWith('C:\\') && !fullPath.startsWith('D:\\') && !fullPath.startsWith('E:\\') && !fullPath.startsWith('F:\\')) {
                        fullPath = '\\' + dirHandle.name;
                    }
                    
                    currentLocalPath = fullPath;
                    localPathHistory = [currentLocalPath];

                    document.getElementById('goUpBtn').disabled = true;
                    document.getElementById('refreshBtn').disabled = false;

                    await loadLocalDirectory(dirHandle);
                } else {
                    alert('您的浏览器不支持现代文件系统API\n\n请使用 Chrome 或 Edge 浏览器，以获得最佳体验\n\n支持：直接保存文件到本地文件夹、完整的文件夹浏览功能');
                    selectLocalDirectoryFallback();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('Error selecting directory:', err);
                    alert('选择目录失败: ' + err.message);
                }
            }
        }

        async function getFullPath(dirHandle) {
            const pathParts = [];
            let current = dirHandle;
            
            try {
                while (current) {
                    pathParts.unshift(current.name);
                    current = await current.parent;
                }
            } catch (err) {
                console.log('Reached root directory');
            }
            
            return '/' + pathParts.join('/');
        }

        function selectLocalDirectoryFallback() {
            const input = document.createElement('input');
            input.type = 'file';
            input.webkitdirectory = true;
            input.multiple = true;
            input.style.display = 'none';

            input.addEventListener('change', async function(e) {
                const files = e.target.files;
                if (files.length > 0) {
                    const firstFile = files[0];
                    const relativePath = firstFile.webkitRelativePath;
                    const pathParts = relativePath.split('/');
                    const folderName = pathParts[0];

                    currentLocalPath = '/' + folderName;
                    localPathHistory = [currentLocalPath];
                    localFilesToUpload = Array.from(files);

                    document.getElementById('goUpBtn').disabled = true;
                    document.getElementById('refreshBtn').disabled = false;

                    renderLocalFilesFallback(files, folderName);
                    updateLocalBreadcrumb(currentLocalPath);
                }
            });

            document.body.appendChild(input);
            input.click();
            setTimeout(() => document.body.removeChild(input), 1000);
        }

        function renderLocalFilesFallback(files, folderName) {
            const header = localFileList.querySelector('.file-list-header');
            localFileList.innerHTML = '';
            if (header) localFileList.appendChild(header);

            const firstLevelEntries = new Set();
            const fileMap = {};

            const expectedPrefix = folderName + '/';

            for (const file of files) {
                const relativePath = file.webkitRelativePath;
                
                if (relativePath.startsWith(expectedPrefix)) {
                    const remainingPath = relativePath.substring(expectedPrefix.length);
                    const pathParts = remainingPath.split('/');
                    
                    if (pathParts.length === 1) {
                        const fileName = pathParts[0];
                        if (fileName) {
                            firstLevelEntries.add(fileName);
                            fileMap[fileName] = file;
                        }
                    } else if (pathParts.length > 1) {
                        const folderNameOnly = pathParts[0];
                        if (folderNameOnly) {
                            firstLevelEntries.add(folderNameOnly);
                        }
                    }
                } else if (relativePath === folderName) {
                    firstLevelEntries.add(relativePath);
                }
            }

            const folderEntries = [];
            const fileEntries = [];

            for (const entryName of firstLevelEntries) {
                const file = fileMap[entryName];
                if (file) {
                    fileEntries.push({
                        name: entryName,
                        isDirectory: false,
                        file: file
                    });
                } else {
                    folderEntries.push({
                        name: entryName,
                        isDirectory: true,
                        path: '/' + folderName + '/' + entryName
                    });
                }
            }

            const allEntries = [...folderEntries, ...fileEntries];

            allEntries.sort((a, b) => {
                if (a.isDirectory !== b.isDirectory) {
                    return a.isDirectory ? -1 : 1;
                }
                return a.name.localeCompare(b.name);
            });

            if (allEntries.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.textContent = '该目录为空';
                localFileList.appendChild(emptyDiv);
                document.getElementById('localFileCount').textContent = '0 项目';
                return;
            }

            localFilesData = allEntries;

            allEntries.forEach((entry) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item' + (entry.isDirectory ? ' directory' : '');
                fileItem.dataset.name = entry.name;

                const icon = entry.isDirectory ? '📁' : '📄';

                fileItem.innerHTML = `
                    <span class="icon">${icon}</span>
                    <span class="name" title="${escapeHtml(entry.name)}">${escapeHtml(entry.name)}</span>
                    <span class="size">-</span>
                    <span class="date"></span>
                `;

                if (entry.isDirectory) {
                    fileItem.addEventListener('click', () => {
                        navigateToSubDirectoryFallback(entry.name);
                    });
                } else {
                    fileItem.addEventListener('click', () => {
                        toggleLocalFileSelectionFallback(entry, fileItem);
                    });
                }

                localFileList.appendChild(fileItem);
            });

            document.getElementById('localFileCount').textContent = allEntries.length + ' 项目';
        }

        function navigateToRootFallback() {
            if (!localFilesToUpload || localFilesToUpload.length === 0) return;
            const firstFile = localFilesToUpload[0];
            const rootFolderName = firstFile.webkitRelativePath.split('/')[0];
            renderLocalFilesFallback(localFilesToUpload, rootFolderName);
            currentLocalPath = '/' + rootFolderName;
            document.getElementById('goUpBtn').disabled = true;
            updateLocalBreadcrumb(currentLocalPath);
        }

        function navigateToPathFallback(targetSubPath) {
            if (!localFilesToUpload || localFilesToUpload.length === 0) return;
            const rootFolderName = localFilesToUpload[0].webkitRelativePath.split('/')[0];
            const fullPath = '/' + rootFolderName + targetSubPath;
            renderLocalFilesFallback(localFilesToUpload, fullPath.substring(1));
            currentLocalPath = fullPath;
            document.getElementById('goUpBtn').disabled = targetSubPath === '';
            updateLocalBreadcrumb(fullPath);
        }

        function navigateToSubDirectoryFallback(dirName) {
            let newPath = '';
            if (currentLocalPath.endsWith('/' + dirName)) {
                newPath = currentLocalPath;
            } else {
                newPath = currentLocalPath + '/' + dirName;
            }
            localPathHistory.push(newPath);
            renderLocalFilesFallback(localFilesToUpload, newPath.substring(1));
            currentLocalPath = newPath;
            document.getElementById('goUpBtn').disabled = false;
            updateLocalBreadcrumb(newPath);
        }

        function toggleLocalFileSelectionFallback(entry, fileItem) {
            const existingIndex = selectedLocalEntries.findIndex(e => e.name === entry.name && e.file === entry.file);

            if (existingIndex >= 0) {
                selectedLocalEntries.splice(existingIndex, 1);
                fileItem.classList.remove('selected');
            } else {
                selectedLocalEntries.push(entry);
                fileItem.classList.add('selected');
            }

            updateLocalSelectedFiles();
        }

        async function loadLocalDirectory(dirHandle, subPath = '') {
            try {
                localFileList.innerHTML = '<div class="empty-message">正在加载...</div>';

                let entries = [];
                let fullPath = '';

                if (subPath) {
                    const pathParts = subPath.split('/').filter(p => p);
                    let currentHandle = dirHandle;
                    for (const part of pathParts) {
                        currentHandle = await currentHandle.getDirectoryHandle(part);
                    }
                    entries = await getEntriesFromHandle(currentHandle);
                    fullPath = '/' + dirHandle.name + subPath;
                } else {
                    entries = await getEntriesFromHandle(dirHandle);
                    fullPath = '/' + dirHandle.name;
                }

                currentLocalPath = fullPath;
                currentLocalDirHandle = dirHandle;
                localFilesToUpload = entries;

                renderLocalDirectory(entries, subPath);
                updateLocalBreadcrumb(currentLocalPath);

                const isAtRoot = subPath.split('/').filter(p => p).length === 0;
                document.getElementById('goUpBtn').disabled = isAtRoot;

            } catch (err) {
                console.error('Error loading directory:', err);
                localFileList.innerHTML = '<div class="empty-message">加载目录失败: ' + err.message + '</div>';
            }
        }

        async function getEntriesFromHandle(dirHandle) {
            const entries = [];
            for await (const entry of dirHandle.values()) {
                entries.push({
                    name: entry.name,
                    isDirectory: entry.kind === 'directory',
                    handle: entry
                });
            }
            entries.sort((a, b) => {
                if (a.isDirectory !== b.isDirectory) {
                    return a.isDirectory ? -1 : 1;
                }
                return a.name.localeCompare(b.name);
            });
            return entries;
        }

        let localFilesData = [];
        let localSortField = 'name';
        let localSortAsc = true;

        function renderLocalDirectory(entries, currentSubPath) {
            localFilesData = entries;
            
            const header = localFileList.querySelector('.file-list-header');
            localFileList.innerHTML = '';
            if (header) localFileList.appendChild(header);
            
            if (entries.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.textContent = '该目录为空';
                localFileList.appendChild(emptyDiv);
                document.getElementById('localFileCount').textContent = '0 项目';
                return;
            }
            
            const sortedEntries = sortLocalEntries(entries, localSortField, localSortAsc);
            
            sortedEntries.forEach((entry) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item' + (entry.isDirectory ? ' directory' : '');
                fileItem.dataset.name = entry.name;

                const icon = entry.isDirectory ? '📁' : '📄';

                fileItem.innerHTML = `
                    <span class="icon">${icon}</span>
                    <span class="name" title="${escapeHtml(entry.name)}">${escapeHtml(entry.name)}</span>
                    <span class="size">-</span>
                    <span class="date"></span>
                `;
                
                if (entry.isDirectory) {
                    fileItem.addEventListener('click', () => {
                        navigateToSubDirectory(entry.name);
                    });
                } else {
                    fileItem.addEventListener('click', () => {
                        toggleLocalFileSelection(entry, fileItem);
                    });
                }
                
                localFileList.appendChild(fileItem);
            });
            
            document.getElementById('localFileCount').textContent = entries.length + ' 项目';
        }

        function sortLocalEntries(entries, field, asc) {
            const dirs = entries.filter(e => e.isDirectory);
            const regularFiles = entries.filter(e => !e.isDirectory);
            
            const sortFn = (a, b) => {
                if (field === 'name') {
                    return asc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                }
                return 0;
            };
            
            dirs.sort(sortFn);
            regularFiles.sort(sortFn);
            
            return [...dirs, ...regularFiles];
        }

        function sortLocalFiles(field) {
            if (localSortField === field) {
                localSortAsc = !localSortAsc;
            } else {
                localSortField = field;
                localSortAsc = true;
            }
            renderLocalDirectory(localFilesData, '');
        }

        function clearLocalSelection() {
            selectedLocalEntries = [];
            updateLocalSelectedFiles();
            uploadBtn.disabled = true;
            document.querySelectorAll('#localFileList .file-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.getElementById('localSelectedInfo').textContent = '';
        }

        function toggleLocalFileSelection(entry, fileItem) {
            const existingIndex = selectedLocalEntries.findIndex(e => e.name === entry.name);
            
            if (existingIndex >= 0) {
                selectedLocalEntries.splice(existingIndex, 1);
                fileItem.classList.remove('selected');
            } else {
                selectedLocalEntries.push(entry);
                fileItem.classList.add('selected');
            }
            
            updateLocalSelectedFiles();
        }

        function updateLocalSelectedFiles() {
            const count = selectedLocalEntries.length;
            if (count > 0) {
                document.getElementById('localSelectedInfo').textContent = '已选择 ' + count + ' 个文件';
                uploadBtn.disabled = false;
            } else {
                document.getElementById('localSelectedInfo').textContent = '';
                uploadBtn.disabled = true;
            }
        }

        function navigateToSubDirectory(dirName) {
            const newPath = currentLocalPath.endsWith('/') ? currentLocalPath + dirName : currentLocalPath + '/' + dirName;
            localPathHistory.push(newPath);
            const subPath = newPath.replace('/' + currentLocalDirHandle.name, '');
            loadLocalDirectory(currentLocalDirHandle, subPath);
        }

        function goUpDirectory() {
            if (!currentLocalDirHandle) {
                alert('当前模式不支持导航上级目录，请重新选择目录');
                return;
            }
            
            const pathParts = currentLocalPath.split('/').filter(p => p);
            
            if (pathParts.length > 1) {
                pathParts.pop();
                const newPath = '/' + pathParts.join('/');
                localPathHistory.push(newPath);
                const subPath = newPath.replace('/' + currentLocalDirHandle.name, '');
                loadLocalDirectory(currentLocalDirHandle, subPath);
            } else {
                document.getElementById('goUpBtn').disabled = true;
            }
        }

        function refreshLocalDirectory() {
            const currentSubPath = currentLocalPath.replace('/' + currentLocalDirHandle.name, '');
            loadLocalDirectory(currentLocalDirHandle, currentSubPath);
        }

        function updateLocalBreadcrumb(fullPath) {
            const breadcrumb = document.getElementById('localBreadcrumb');
            
            if (!fullPath || fullPath === '/') {
                breadcrumb.innerHTML = '';
                return;
            }
            
            const pathWithoutLeadingSlash = fullPath.startsWith('/') ? fullPath.substring(1) : fullPath;
            const allPathParts = pathWithoutLeadingSlash.split('/').filter(p => p);
            
            if (allPathParts.length === 0) {
                breadcrumb.innerHTML = '';
                return;
            }

            let html = '';
            let accumulatedPath = '';
            const rootFolderName = allPathParts[0];

            allPathParts.forEach((part, index) => {
                accumulatedPath += '/' + part;
                
                if (index === 0) {
                    if (currentLocalDirHandle) {
                        html = `<span class="breadcrumb-item" onclick="loadLocalDirectory(currentLocalDirHandle, '')">${part}</span>`;
                    } else if (localFilesToUpload && localFilesToUpload.length > 0) {
                        html = `<span class="breadcrumb-item" onclick="navigateToRootFallback()">${part}</span>`;
                    }
                } else {
                    const subPathForClick = accumulatedPath.substring(('/' + rootFolderName).length);
                    if (currentLocalDirHandle) {
                        html += ` <span class="breadcrumb-separator">/</span> <span class="breadcrumb-item" onclick="loadLocalDirectory(currentLocalDirHandle, '${subPathForClick}')">${part}</span>`;
                    } else {
                        html += ` <span class="breadcrumb-separator">/</span> <span class="breadcrumb-item" onclick="navigateToPathFallback('${subPathForClick}')">${part}</span>`;
                    }
                }
            });

            breadcrumb.innerHTML = html;
        }

        async function uploadFiles() {
            if (selectedLocalEntries.length === 0) return;

            const remotePath = document.getElementById('remotePath').value || '/';
            let successCount = 0;
            let failCount = 0;

            for (const entry of selectedLocalEntries) {
                try {
                    const file = await entry.handle.getFile();
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('remotePath', remotePath);

                    const response = await fetch(API_HOST + '/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (err) {
                    console.error('Upload error:', err);
                    failCount++;
                }
            }

            alert(`上传完成！成功: ${successCount}, 失败: ${failCount}`);
            
            if (successCount > 0) {
                selectedLocalEntries = [];
                updateLocalSelectedFiles();
                refreshLocalDirectory();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function checkBackendStatus() {
            try {
                console.log('[Health] Checking backend at:', API_HOST + '/api/health');
                const response = await fetch(API_HOST + '/api/health');
                console.log('[Health] Response status:', response.status);
                if (response.ok) {
                    backendStatus = true;
                    connectionStatus.textContent = '后端服务正常';
                    connectionStatus.className = 'status connected';
                }
            } catch (error) {
                console.error('[Health] Backend check failed:', error);
                backendStatus = false;
                connectionStatus.textContent = '后端未启动';
                connectionStatus.className = 'status disconnected';
            }
        }

        init();
    </script>
</body>
</html>
