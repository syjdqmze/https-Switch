<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STM32F407 Trae 开发与调试全流程指南</title>
<style>
  :root {
    --accent: #1e6fd9;
    --accent-dark: #1558b0;
    --accent-bg: #e8f1fd;
    --sidebar-bg: #f8f9fb;
    --border: #e3e6ea;
    --text: #24292f;
    --text-2: #57606a;
    --code-bg: #f6f8fa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    color: var(--text);
    background: #fff;
    overflow: hidden;
  }
  /* ===== Header ===== */
  .header {
    height: 52px; flex: 0 0 52px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    background: linear-gradient(90deg, #0d3b8c, #1e6fd9);
    color: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    position: relative; z-index: 20;
  }
  .header h1 { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header .sub { flex: 0 0 auto; font-size: 12px; opacity: .75; margin-left: auto; white-space: nowrap; }
  /* ===== Layout ===== */
  .layout { display: flex; height: calc(100% - 52px); }
  /* ===== Sidebar ===== */
  .sidebar {
    width: 350px; flex: 0 0 350px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: margin-left .25s ease;
  }
  .sidebar.collapsed { margin-left: -350px; }
  .toc-tools { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .toc-tools input {
    width: 100%; padding: 7px 10px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 6px; outline: none;
    background: #fff;
  }
  .toc-tools input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,111,217,.12); }
  .toc { flex: 1; overflow-y: auto; padding: 8px 0 30px; }
  .toc::-webkit-scrollbar { width: 8px; }
  .toc::-webkit-scrollbar-thumb { background: #d0d5db; border-radius: 4px; }
  .toc-item-all {
    display: block; width: 100%; text-align: left;
    padding: 8px 16px; font-size: 13.5px; font-weight: 600;
    background: none; border: none; cursor: pointer; color: var(--text);
    border-left: 3px solid transparent;
  }
  .toc-item-all:hover { background: #eef1f5; }
  .toc-item-all.active { color: var(--accent); background: var(--accent-bg); border-left-color: var(--accent); }
  .toc-h1 { margin-top: 2px; }
  .toc-h1-row {
    display: flex; align-items: center;
    padding: 7px 12px 7px 14px;
    cursor: pointer; user-select: none;
    border-left: 3px solid transparent;
  }
  .toc-h1-row:hover { background: #eef1f5; }
  .toc-h1-row.active { background: var(--accent-bg); border-left-color: var(--accent); }
  .toc-h1-row.active .toc-h1-text { color: var(--accent); }
  .toc-h1-text { font-size: 13.5px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.45; }
  .toc-h1-row.active .toc-h1-text { color: var(--accent); }
  .chev {
    flex: 0 0 18px; height: 18px; margin-right: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .18s ease; color: #8b949e; font-size: 11px;
  }
  .toc-h1.open > .toc-h1-row .chev { transform: rotate(90deg); }
  .toc-sub { display: none; padding: 1px 0 4px; }
  .toc-h1.open > .toc-sub { display: block; }
  .toc-h2 {
    display: block; width: 100%; text-align: left;
    padding: 5px 12px 5px 40px;
    font-size: 12.5px; color: var(--text-2);
    background: none; border: none; cursor: pointer;
    border-left: 3px solid transparent;
    line-height: 1.5;
  }
  .toc-h2:hover { background: #eef1f5; color: var(--text); }
  .toc-h2.active { color: var(--accent); background: var(--accent-bg); border-left-color: var(--accent); font-weight: 600; }
  .toc-h2.hidden-by-search, .toc-h1.hidden-by-search { display: none; }
  mark { background: #ffe58f; padding: 0 1px; border-radius: 2px; }
  /* ===== Content ===== */
  .content-wrap { flex: 1; overflow-y: auto; scroll-behavior: smooth; position: relative; background: #dfe4ea; }
  /* A4 纸张：210mm × 297mm */
  .content {
    width: 210mm;
    max-width: 100%;
    min-height: 297mm;
    margin: 20px auto 40px;
    padding: 20mm 20mm 25mm;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 10px 30px rgba(0,0,0,.14);
    display: flex; flex-direction: column;
  }
  .content > * { flex: 0 0 auto; }
  /* 弹性间隔：把导航推到纸面底边，纸面内无滚动条 */
  .nav-spacer { flex: 1 0 36px; }
  /* A4 页眉：居中显示文档题目（Word 页眉样式） */
  .sheet-header {
    text-align: center;
    font-size: 13px; color: #777;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin: -4px 0 20px;
  }
  /* 全文浏览：多页 A4 纸面，页间 3px 间隔 */
  .content.pages {
    width: auto; max-width: none; min-height: 0;
    margin: 20px 0 40px; padding: 0;
    background: none; box-shadow: none; display: block;
  }
  .content.pages > .page {
    width: 210mm; max-width: 100%; min-height: 297mm;
    margin: 0 auto 3px; padding: 20mm 20mm 25mm;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 10px 30px rgba(0,0,0,.14);
    display: flex; flex-direction: column;
  }
  .content.pages > .page > * { flex: 0 0 auto; }
  /* A4 页脚：版权信息 */
  .sheet-footer {
    text-align: center;
    font-size: 12px; color: #999;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }
  .content h1.doc-h1 {
    font-size: 26px; font-weight: 700;
    padding-bottom: 12px; margin: 34px 0 18px;
    border-bottom: 2px solid var(--accent);
    color: #0d3b8c;
  }
  .content h1.doc-h1:first-child { margin-top: 0; }
  .content h2.doc-h2 {
    font-size: 19px; font-weight: 650;
    margin: 30px 0 12px; padding: 6px 0 6px 12px;
    border-left: 4px solid var(--accent);
    background: linear-gradient(90deg, var(--accent-bg), transparent 70%);
    border-radius: 0 6px 6px 0;
  }
  .content p { font-size: 14.5px; line-height: 1.85; margin: 10px 0; }
  .content ul { margin: 10px 0 10px 24px; }
  .content li { font-size: 14.5px; line-height: 1.85; margin: 4px 0; }
  code.inline {
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    background: #eff1f4;
    color: #c7254e;
    padding: 1.5px 6px; border-radius: 4px;
    overflow-wrap: anywhere; word-break: break-word;
  }
  pre.codeblock {
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 14px 18px;
    margin: 14px 0;
    overflow-x: auto;
    font-family: Consolas, "Cascadia Code", "Courier New", monospace;
    font-size: 13px; line-height: 1.65;
    box-shadow: inset 0 0 0 1px #1e293b;
  }
  pre.codeblock .cmt { color: #7dd3fc; }
  table.doc-table {
    border-collapse: collapse; width: 100%;
    margin: 14px 0; font-size: 13.5px;
    box-shadow: 0 0 0 1px var(--border);
    border-radius: 6px; overflow: hidden;
  }
  .doc-table th, .doc-table td {
    border: 1px solid var(--border);
    padding: 8px 12px; text-align: left;
    line-height: 1.6; vertical-align: top;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .tbl-wrap { overflow-x: auto; }
  .doc-table thead th {
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .doc-table tbody tr:nth-child(even) { background: #f6f8fa; }
  .doc-table tbody tr:hover { background: var(--accent-bg); }
  .doc-table td:first-child { font-weight: 600; color: #0d3b8c; }
  .doc-table.no-header td:first-child { font-weight: 600; }
  .doc-img {
    display: block; max-width: 100%; margin: 16px auto;
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    cursor: zoom-in;
  }
  /* 图片放大预览层：只覆盖正文区域，不遮挡顶栏与左侧目录 */
  .img-lightbox {
    position: fixed; top: 52px; right: 0; bottom: 0; left: 350px;
    z-index: 100; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0,0,0,.82); cursor: zoom-out;
  }
  .img-lightbox.show { display: flex; }
  body.toc-collapsed .img-lightbox { left: 0; }
  .img-lightbox img {
    max-width: 100%; max-height: 100%;
    border-radius: 8px; background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  /* ===== 封面（与 Word 封面格式一致：居中 + 大留白） ===== */
  .cover { text-align: center; color: #000; }
  .cover-title {
    font-size: 23.5px; font-weight: 700;
    margin-top: 80px; line-height: 1.5;
  }
  .cover-sub { font-size: 17.5px; margin-top: 16px; }
  .cover-table {
    width: 16cm; max-width: 100%;
    margin: 52px auto 0;
    text-align: left;
  }
  .cover-table td:first-child { width: 3.2cm; }
  .cover-note { font-size: 12.5px; margin-top: 44px; }
  .sec-nav { display: flex; justify-content: space-between; gap: 12px; flex: 0 0 auto; padding-top: 12px; border-top: 1px solid var(--border); }
  .sec-nav button {
    border: 1px solid var(--border); background: #fff; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; color: var(--text);
    flex: 0 1 auto; max-width: 48%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sec-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .sec-nav button:disabled { opacity: .35; cursor: default; }
  /* ===== Mobile ===== */
  .menu-btn {
    display: block; background: rgba(255,255,255,.15); border: none; color: #fff;
    width: 32px; height: 32px; border-radius: 6px; font-size: 16px; cursor: pointer;
    flex: 0 0 32px;
  }
  .menu-btn:hover { background: rgba(255,255,255,.3); }
  /* 目录栏外边缘的收起/展开按钮：跟随目录栏左右移动 */
  .edge-toggle {
    position: fixed; top: 50%; left: 350px; z-index: 40;
    transform: translateY(-50%);
    width: 32px; height: 64px; border-radius: 6px; border: none;
    background: none; color: var(--accent); font-size: 16px; cursor: pointer;
    transition: left .25s ease, color .15s;
  }
  .edge-toggle:hover { color: var(--accent-2); }
  .edge-toggle.moved { left: 0; }
  .mask { display: none; }
  @media (max-width: 860px) {
    .img-lightbox { left: 0; }
    .header .sub { display: none; }
    .sidebar {
      position: fixed; top: 52px; bottom: 0; left: 0; z-index: 15;
      margin-left: -350px; box-shadow: 4px 0 14px rgba(0,0,0,.12);
    }
    .sidebar.mobile-open { margin-left: 0; }
    .mask.show { display: block; position: fixed; inset: 52px 0 0; background: rgba(0,0,0,.35); z-index: 14; }
    .content { margin: 0 auto 20px; padding: 22px 18px 70px; min-height: auto; }
    .content.pages { margin: 0 0 20px; padding: 0; }
    .content.pages > .page { margin: 0 0 3px; padding: 22px 18px 70px; min-height: auto; }
    .edge-toggle { display: none; }
  }
  /* ===== 打印：A4 纸张输出 ===== */
  @page { size: A4; margin: 18mm 16mm; }
  @media print {
    body { overflow: visible; }
    .header, .sidebar, .mask, .menu-btn, .sec-nav, .toc-tools, .nav-spacer, .edge-toggle, .img-lightbox { display: none !important; }
    .layout { display: block; height: auto; }
    .content-wrap { overflow: visible; background: #fff; height: auto; }
    .content {
      width: auto; max-width: none; min-height: auto;
      margin: 0; padding: 0;
      box-shadow: none;
    }
    .content.pages { margin: 0; }
    .content.pages > .page {
      width: auto; max-width: none; min-height: auto;
      margin: 0; padding: 0 0 14pt; box-shadow: none;
    }
    pre.codeblock, table.doc-table, .doc-img { break-inside: avoid; }
    .content h1.doc-h1, .content h2.doc-h2 { break-after: avoid; }
    /* 打印页眉：每个打印页顶部重复显示文档题目（位于页边距区，不压正文） */
    .sheet-header {
      position: fixed; top: 4mm; left: 0; right: 0;
      margin: 0; padding: 0 0 4px;
      font-size: 10pt; color: #666;
      border-bottom: 1px solid #bbb;
      background: #fff;
    }
  }
</style>

"    huart1.Init.WordLength = UART_WORDLENGTH_8B;", "b": false, "i": false, "code": true}], "text": "#include \"main.h\"\n#include <stdio.h>\n \nUART_HandleTypeDef huart1;\n \nstatic void SystemClock_Config(void);\nstatic void MX_GPIO_Init(void);\nstatic void MX_USART1_UART_Init(void);\n \nint _write(int fd, char *ptr, int len)\n{\n    HAL_UART_Transmit(&huart1, (uint8_t *)ptr, len, HAL_MAX_DELAY);\n    return len;\n}\n \nint main(void)\n{\n    HAL_Init();\n    SystemClock_Config();\n    MX_GPIO_Init();\n    MX_USART1_UART_Init();\n    setvbuf(stdout, NULL, _IONBF, 0);\n \n    printf(\"\\r\\n==== STM32F407 BOOT ====\\r\\n\");\n    printf(\"SYSCLK = %lu Hz\\r\\n\", HAL_RCC_GetSysClockFreq());\n \n    uint32_t tick = 0;\n    while (1)\n    {\n        printf(\"[INFO] alive  t=%lus  tick=%lu\\r\\n\", HAL_GetTick() / 1000, tick++);\n        HAL_GPIO_TogglePin(GPIOF, GPIO_PIN_9);   /* 正点原子探索者/野火 F407ZG 板 LED */\n        HAL_Delay(1000);\n    }\n}\n \nstatic void MX_USART1_UART_Init(void)\n{\n    huart1.Instance = USART1;\n    huart1.Init.BaudRate = 115200;\n    huart1.Init.WordLength = UART_WORDLENGTH_8B;"}, {"t": "p", "runs": [{"type": "text", "text": "    huart1.Init.StopBits = UART_STOPBITS_1;", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "    huart1.Init.Parity = UART_PARITY_NONE;", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "    huart1.Init.Mode = UART_MODE_TX_RX;", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "    huart1.Init.HwFlowCtl = UART_HWCONTROL_NONE;", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "    huart1.Init.OverSampling = UART_OVERSAMPLING_16;", "b": false, "i": false, "code": true}, {"type": "te M3，115200 8N1，ST-Link 烧录。", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": " ", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "请遵守以下工作约定：", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "1. 编译用 `python -m platformio run`，烧录用 `python -m platformio run -t upload`，不要用 GUI 工具；", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "2. 读写串口一律用 serial-debug 的 MCP 工具，不要自己写 Python 临时脚本；", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "3. 每次串口操作结束后必须 close_port，避免占用；", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "4. 读取日志用 read_until 或 read_port，单次不超过 5 秒；", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "5. 修改代码前先说明改哪个文件、改什么、为什么；", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "6. 出现编译错误时，先完整读一遍报错再动手。", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": " ", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "当前任务：<在这里写需求>", "b": false, "i": false, "code": true}], "text": "本项目：STM32F407ZGT6 + PlatformIO，串口 USART1，COM3，115200 8N1，ST-Link 烧录。\n \n请遵守以下工作约定：\n1. 编译用 `python -m platformio run`，烧录用 `python -m platformio run -t upload`，不要用 GUI 工具；\n2. 读写串口一律用 serial-debug 的 MCP 工具，不要自己写 Python 临时脚本；\n3. 每次串口操作结束后必须 close_port，避免占用；\n4. 读取日志用 read_until 或 read_port，单次不超过 5 秒；\n5. 修改代码前先说明改哪个文件、改什么、为什么；\n6. 出现编译错误时，先完整读一遍报错再动手。\n \n当前任务：<在这里写需求>"}, {"t": "h2", "text": "9.3 典型任务提示词"}, {"t": "p", "runs": [{"type": "text", "text": "任务 1：验证串口通路", "b": true, "i": false, "code": false}], "text": "任务 1：验证串口通路"}, {"t": "p", "runs": [{"type": "text", "text": "打开 COM3（115200），用 read_until 等待 \"BOOT\" 关键字，超时 5 秒，", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "把日志贴出来并判断板子是否正常启动。", "b": false, "i": false, "code": true}], "text": "打开 COM3（115200），用 read_until 等待 \"BOOT\" 关键字，超时 5 秒，\n把日志贴出来并判断板子是否正常启动。"}, {"t": "p", "runs": [{"type": "text", "text": "任务 2：定位启动卡死", "b": true, "i": false, "code": false}], "text": "任务 2：定位启动卡死"}, {"t": "p", "runs": [{"type": "text", "text": "重新烧录后立即打开 COM3 并读 8 秒日志。", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "按时间顺序分析最后一条打印出现在哪里，判断卡在哪个初始化函数，", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "并检查对应源码。", "b": false, "i": false, "code": true}], "text": "重新烧录后立即打开 COM3 并读 8 秒日志。\n按时间顺序分析最后一条打印出现在哪里，判断卡在哪个初始化函数，\n并检查对应源码。"}, {"t": "p", "runs": [{"type": "text", "text": "任务 3：新增一条 CLI 命令", "b": true, "i": false, "code": false}], "text": "任务 3：新增一条 CLI 命令"}, {"t": "p", "runs": [{"type": "text", "text": "在现有命令解析里增加一条 `ver` 命令，返回固件版本字符串 FW_VERSION。", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "改完编译、烧录，然后用 send_and_wait 发送 \"ver\" 验证返回值。", "b": false, "i": false, "code": true}], "text": "在现有命令解析里增加一条 `ver` 命令，返回固件版本字符串 FW_VERSION。\n改完编译、烧录，然后用 send_and_wait 发送 \"ver\" 验证返回值。"}, {"t": "p", "runs": [{"type": "text", "text": "任务 4：排查乱码", "b": true, "i": false, "code": false}], "text": "任务 4：排查乱码"}, {"t": "p", "runs": [{"type": "text", "text": "读到的日志是乱码。请依次检查：波特率是否为 115200、字符编码是否需要 gbk、", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "时钟配置（HSE/PLL）是否与板载晶振匹配，给出结论并修复。", "b": false, "i": false, "code": true}], "text": "读到的日志是乱码。请依次检查：波特率是否为 115200、字符编码是否需要 gbk、\n时钟配置（HSE/PLL）是否与板载晶振匹配，给出结论并修复。"}, {"t": "p", "runs": [{"type": "text", "text": "任务 5：回归验证", "b": true, "i": false, "code": false}], "text": "任务 5：回归验证"}, {"t": "p", "runs": [{"type": "text", "text": "按以下用例依次发送指令并记录返回，全部通过后关闭串口：", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "1) help      → 应包含命令列表", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "2) ver       → 应返回 FW_VERSION", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "3) status    → 应返回 OK", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "把结果整理成表格。", "b": false, "i": false, "code": true}], "text": "按以下用例依次发送指令并记录返回，全部通过后关闭串口：\n1) help      → 应包含命令列表\n2) ver       → 应返回 FW_VERSION\n3) status    → 应返回 OK\n把结果整理成表格。"}, {"t": "h2", "text": "9.4 固化成项目规则"}, {"t": "p", "runs": [{"type": "text", "text": "新建 ", "b": false, "i": false, "code": false}, {"type": "text", "text": ".trae/rules/project_rules.md", "b": false, "i": false, "code": true}, {"type": "text", "text": "，写入：", "b": false, "i": false, "code": false}], "text": "新建 .trae/rules/project_rules.md，写入："}, {"t": "p", "runs": [{"type": "text", "text": "# STM32F407 项目约定", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": " ", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 芯片：STM32F407ZGT6（1MB Flash / 128KB RAM / HSE 8MHz），框架 stm32cube，构建工具 PlatformIO", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 串口：USART1（PA9/PA10），115200 8N1", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 烧录：`python -m platformio run -t upload`（ST-Link）", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 串口读写：只用 serial-debug MCP 工具，禁止另写脚本", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 串口用完必须 close_port", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 日志读取单次 ≤ 5 秒，优先用 read_until 等待关键字", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 修改 `main.c` 的时钟配置前必须先确认板载晶振频率（168MHz 上限，PLLN=336）", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "- 不要修改 `platformio.ini` 中的 upload_protocol / debug_tool", "b": false, "i": false, "code": true}], "text": "# STM32F407 项目约定\n \n- 芯片：STM32F407ZGT6（1MB Flash / 128KB RAM / HSE 8MHz），框架 stm32cube，构建工具 PlatformIO\n- 串口：USART1（PA9/PA10），115200 8N1\n- 烧录：`python -m platformio run -t upload`（ST-Link）\n- 串口读写：只用 serial-debug MCP 工具，禁止另写脚本\n- 串口用完必须 close_port\n- 日志读取单次 ≤ 5 秒，优先用 read_until 等待关键字\n- 修改 `main.c` 的时钟配置前必须先确认板载晶振频率（168MHz 上限，PLLN=336）\n- 不要修改 `platformio.ini` 中的 upload_protocol / debug_tool"}, {"t": "p", "runs": [{"type": "text", "text": "这样后续每轮对话都自动生效，不用反复交代。", "b": false, "i": false, "code": false}], "text": "这样后续每轮对话都自动生效，不用反复交代。"}, {"t": "h2", "text": "9.5 提效技巧"}, {"t": "table", "rows": [["技巧", "说明"], ["让 AI 先读日志再改代码", "避免\"猜着改\""], ["一次只改一个变量", "便于归因"], ["抓日志存文件", "save_log 保存到 logs/boot-<时间>.log，便于对比前后差异"], ["关键节点加打印", "在可疑函数入口/出口加 printf(\"[TRACE] %s enter\\r\\n\", __func__)"], ["用 read_until 而非 read_port", "更快返回，不浪费等待时间"], ["烧录后强制复位", "用 OpenOCD monitor reset run 或 pulse_reset（若接线支持）"]], "header": true}, {"t": "h1", "text": "10. 第七步：断点调试（OpenOCD + GDB）"}, {"t": "p", "runs": [{"type": "text", "text": "串口给不了断点，这部分必须走 SWD。", "b": false, "i": false, "code": false}], "text": "串口给不了断点，这部分必须走 SWD。"}, {"t": "h2", "text": "10.1 启动 OpenOCD（终端 1）"}, {"t": "p", "runs": [{"type": "text", "text": "openocd -f interface/stlink.cfg -f target/stm32f4x.cfg", "b": false, "i": false, "code": true}], "text": "openocd -f interface/stlink.cfg -f target/stm32f4x.cfg"}, {"t": "p", "runs": [{"type": "text", "text": "PlatformIO 自带的 OpenOCD 在 ", "b": false, "i": false, "code": false}, {"type": "text", "text": "~/.platformio/packages/tool-openocd/bin/", "b": false, "i": false, "code": true}, {"type": "text", "text": "， 若命令找不到，直接用绝对路径，或执行 ", "b": false, "i": false, "code": false}, {"type": "text", "text": "pio debug", "b": false, "i": false, "code": true}, {"type": "text", "text": " 让 PlatformIO 托管。", "b": false, "i": false, "code": false}], "text": "PlatformIO 自带的 OpenOCD 在 ~/.platformio/packages/tool-openocd/bin/， 若命令找不到，直接用绝对路径，或执行 pio debug 让 PlatformIO 托管。"}, {"t": "p", "runs": [{"type": "text", "text": "启动成功会看到：", "b": false, "i": false, "code": false}], "text": "启动成功会看到："}, {"t": "p", "runs": [{"type": "text", "text": "Info : STLINK V2J...", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "Info : Target voltage: 3.3V", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "Info : stm32f4x.cpu: hardware has 6 breakpoints, 4 watchpoints", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "Info : Listening on port 3333 for gdb connections", "b": false, "i": false, "code": true}], "text": "Info : STLINK V2J...\nInfo : Target voltage: 3.3V\nInfo : stm32f4x.cpu: hardware has 6 breakpoints, 4 watchpoints\nInfo : Listening on port 3333 for gdb connections"}, {"t": "h2", "text": "10.2 GDB 连接（终端 2）"}, {"t": "p", "runs": [{"type": "text", "text": "arm-none-eabi-gdb .pio/build/stm32f407zg/firmware.elf", "b": false, "i": false, "code": true}], "text": "arm-none-eabi-gdb .pio/build/stm32f407zg/firmware.elf"}, {"t": "p", "runs": [{"type": "text", "text": "GDB 内：", "b": false, "i": false, "code": false}], "text": "GDB 内："}, {"t": "p", "runs": [{"type": "text", "text": "target extended-remote localhost:3333", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "monitor reset halt          # 复位并停在复位向量", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "load                        # 下载固件", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "break main                  # 在 main 下断点", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "continue                    # 运行到 main", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "next                        # 单步（不进入函数）", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type": "text", "text": "step                        # 单步（进入函数）", "b": false, "i": false, "code": true}, {"type": "text", "text": "\n", "b": false, "i": false, "code": false}, {"type" /* ---------- Build section index ---------- */
// heading entries: {idx, level:1|2, text, id}
const headings = [];
ITEMS.forEach((it, i) => {
  if (it.t === 'h1') headings.push({ idx: i, level: 1, text: it.text, id: 'sec-' + i });
  else if (it.t === 'h2') headings.push({ idx: i, level: 2, text: it.text, id: 'sec-' + i });
});
const firstH1 = headings.length ? headings[0].idx : ITEMS.length;
const hasPreamble = firstH1 > 0;

// section end: next heading with level <= current
function sectionEnd(h) {
  for (let k = 0; k < headings.length; k++) {
    if (headings[k].idx > h.idx && headings[k].level <= h.level) return headings[k].idx;
  }
  return ITEMS.length;
}

const navList = [];
if (hasPreamble) navList.push({ idx: 0, end: firstH1, level: 0, text: '封面', id: 'sec-info' });
headings.forEach(h => navList.push({ ...h, end: sectionEnd(h) }));

/* ---------- Render helpers ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// 页脚版权：当前日期起 10 年
const COPY_LINE = `© 2026–2036 版权归 Erish 个人所有，保留所有权利`;

function runsToHtml(runs, inPre) {
  let html = '';
  for (const r of runs) {
    if (r.type === 'img') {
      html += `<img class="doc-img" src="${r.src}" alt="插图">`;
      continue;
    }
    let t = esc(r.text);
    if (!inPre) t = t.replace(/\n/g, '<br>');
    if (inPre) { html += t; continue; }
    if (r.code) { html += `<code class="inline">${t}</code>`; continue; }
    if (r.b && r.i) html += `<b><i>${t}</i></b>`;
    else if (r.b) html += `<b>${t}</b>`;
    else if (r.i) html += `<i>${t}</i>`;
    else html += t;
  }
  return html;
}

function isFullCodePara(it) {
  if (it.t !== 'p') return false;
  const textRuns = it.runs.filter(r => r.type === 'text' && r.text.trim() !== '');
  if (!textRuns.length) return false;
  return textRuns.every(r => r.code);
}

/* 封面：按 Word 封面格式渲染（居中标题/副标题/信息表/备注） */
function renderCover() {
  const title = esc(ITEMS[0].text);
  const sub = esc(ITEMS[1].text);
  const tbl = ITEMS[2];
  const note = esc(ITEMS[3].text);
  const rows = tbl.rows.map(r =>
    `<tr><td>${esc(r[0])}</td><td>${esc(r.slice(1).join(' ')).replace(/\n/g,'<br>')}</td></tr>`).join('');
  return `<div class="cover">
    <div class="cover-title">${title}</div>
    <div class="cover-sub">${sub}</div>
    <table class="doc-table cover-table"><tbody>${rows}</tbody></table>
    <div class="cover-note">${note}</div>
  </div>`;
}

function renderRange(start, end) {
  let out = [];
  let codeBuf = [];
  let listBuf = [];
  let i = start;
  if (start === 0 && hasPreamble) {
    out.push(renderCover());
    i = firstH1;
  }
  const flushCode = () => {
    if (codeBuf.length) {
      out.push(`<pre class="codeblock">${codeBuf.join('\n')}</pre>`);
      codeBuf = [];
    }
  };
  const flushList = () => {
    if (listBuf.length) {
      out.push(`<ul>${listBuf.join('')}</ul>`);
      listBuf = [];
    }
  };
  for (; i < end; i++) {
    const it = ITEMS[i];
    if (it.t === 'p' && isFullCodePara(it)) {
      flushList();
      codeBuf.push(it.runs.map(r => r.type === 'text' ? esc(r.text) : '').join(''));
      continue;
    }
    flushCode();
    if (it.t === 'li') { listBuf.push(`<li>${runsToHtml(it.runs)}</li>`); continue; }
    flushList();
    switch (it.t) {
      case 'h1': out.push(`<h1 class="doc-h1" id="sec-${i}">${esc(it.text)}</h1>`); break;
      case 'h2': out.push(`<h2 class="doc-h2" id="sec-${i}">${esc(it.text)}</h2>`); break;
      case 'p':  out.push(`<p>${runsToHtml(it.runs)}</p>`); break;
      case 'table': {
        const rows = it.rows;
        if (!rows.length) break;
        let th = '';
        let bodyRows = rows;
        if (it.header) {
          th = '<thead><tr>' + rows[0].map(c => `<th>${esc(c).replace(/\n/g,'<br>')}</th>`).join('') + '</tr></thead>';
          bodyRows = rows.slice(1);
        }
        const tb = bodyRows.map(r => '<tr>' + r.map(c => `<td>${esc(c).replace(/\n/g,'<br>')}</td>`).join('') + '</tr>').join('');
        out.push(`<div class="tbl-wrap"><table class="doc-table${it.header ? '' : ' no-header'}">${th}<tbody>${tb}</tbody></table></div>`);
        break;
      }
    }
  }
  flushCode(); flushList();
  return out.join('\n');
}

/* ---------- TOC build ---------- */
const tocEl = document.getElementById('toc');
const contentEl = document.getElementById('content');
const contentWrap = document.getElementById('contentWrap');

let tocHtml = `<button class="toc-item-all" data-nav="-2">📄 全文浏览</button>`;
navList.forEach(n => { n.dom = null; });

navList.forEach(n => {
  if (n.level === 0) {
    tocHtml += `<button class="toc-item-all toc-preamble" data-nav="${navList.indexOf(n)}">📑 ${esc(n.text)}</button>`;
  }
});

// build nested h1/h2
const h1Nodes = []; // {navIdx, children:[navIdx]}
navList.forEach((n, ni) => {
  if (n.level === 1) h1Nodes.push({ navIdx: ni, children: [] });
  else if (n.level === 2 && h1Nodes.length) h1Nodes[h1Nodes.length - 1].children.push(ni);
});

h1Nodes.forEach(g => {
  const h1 = navList[g.navIdx];
  tocHtml += `<div class="toc-h1" data-group="${g.navIdx}">
    <div class="toc-h1-row" data-nav="${g.navIdx}">
      <span class="chev">▶</span><span class="toc-h1-text">${esc(h1.text)}</span>
    </div>
    <div class="toc-sub">`;
  g.children.forEach(ci => {
    tocHtml += `<button class="toc-h2" data-nav="${ci}">${esc(navList[ci].text)}</button>`;
  });
  tocHtml += `</div></div>`;
});
tocEl.innerHTML = tocHtml;

/* ---------- Navigation ---------- */
let currentNav = -2; // -2 = all
function setActive(ni) {
  tocEl.querySelectorAll('.active').forEach(e => e.classList.remove('active'));
  if (ni === -2) { tocEl.querySelector('[data-nav="-2"]').classList.add('active'); return; }
  const el = tocEl.querySelector(`[data-nav="${ni}"]`);
  if (!el) return;
  const n = navList[ni];
  if (n.level === 2) {
    el.classList.add('active');
    const group = el.closest('.toc-h1');
    if (group) { group.classList.add('open'); group.querySelector('.toc-h1-row').classList.add('active'); }
  } else if (n.level === 1) {
    el.classList.add('active');
    el.closest('.toc-h1').classList.add('open');
  } else {
    el.classList.add('active');
  }
  const tocRect = tocEl.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  if (r.top < tocRect.top || r.bottom > tocRect.bottom) {
    el.scrollIntoView({ block: 'nearest' });
  }
}

function showNav(ni, push = true) {
  currentNav = ni;
  let start, end;
  if (ni === -2) { start = 0; end = ITEMS.length; }
  else { const n = navList[ni]; start = n.idx; end = n.end; }
  const pos = navList.findIndex((x, i) => i === ni);
  const prev = pos > 0 ? navList[pos - 1] : null;
  const next = pos >= 0 && pos < navList.length - 1 ? navList[pos + 1] : null;
  const navBtns = ni === -2 ? '' : `<div class="sec-nav">
      <button ${prev ? '' : 'disabled'} data-nav="${prev ? pos - 1 : ''}">← ${prev ? esc(prev.text) : '上一节'}</button>
      <button ${next ? '' : 'disabled'} data-nav="${next ? pos + 1 : ''}">${next ? esc(next.text) : '下一节'} →</button>
    </div>`;
  if (ni === -2) {
    /* 全文浏览：封面 + 每章一页 A4 纸面 */
    contentEl.classList.add('pages');
    contentEl.innerHTML = navList.filter(n => n.level <= 1).map(n =>
      `<div class="page"><div class="sheet-header">${esc(ITEMS[0].text)}</div>${renderRange(n.idx, n.end)}<div class="nav-spacer"></div><div class="sheet-footer">${COPY_LINE}</div></div>`
    ).join('');
  } else {
    contentEl.classList.remove('pages');
    contentEl.innerHTML = `<div class="sheet-header">${esc(ITEMS[0].text)}</div>`
      + renderRange(start, end) + (navBtns ? '<div class="nav-spacer"></div>' + navBtns : '')
      + `<div class="sheet-footer">${COPY_LINE}</div>`;
  }
  contentWrap.scrollTop = 0;
  setActive(ni);
  if (push) history.replaceState(null, '', ni === -2 ? '#all' : '#' + navList[ni].id);
  closeMobile();
}

tocEl.addEventListener('click', e => {
  const chev = e.target.closest('.chev');
  if (chev) {
    chev.closest('.toc-h1').classList.toggle('open');
    e.stopPropagation();
    return;
  }
  const btn = e.target.closest('[data-nav]');
  if (btn) showNav(parseInt(btn.dataset.nav, 10));
});
contentEl.addEventListener('click', e => {
  const img = e.target.closest('img.doc-img');
  if (img) { openLightbox(img.getAttribute('src')); return; }
  const btn = e.target.closest('[data-nav]');
  if (btn && btn.dataset.nav !== '') showNav(parseInt(btn.dataset.nav, 10));
});

/* ---------- 图片放大预览 ---------- */
const lightbox = document.getElementById('imgLightbox');
const lightboxImg = lightbox.querySelector('img');
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('show');
}
function closeLightbox() {
  lightbox.classList.remove('show');
  lightboxImg.removeAttribute('src');
}
lightbox.addEventListener('click', closeLightbox);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && lightbox.classList.contains('show')) closeLightbox();
});

/* ---------- TOC search ---------- */
document.getElementById('tocSearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  tocEl.querySelectorAll('mark').forEach(m => m.replaceWith(m.textContent));
  if (!q) {
    tocEl.querySelectorAll('.hidden-by-search').forEach(x => x.classList.remove('hidden-by-search'));
    return;
  }
  h1Nodes.forEach(g => {
    const groupEl = tocEl.querySelector(`[data-group="${g.navIdx}"]`);
    const h1Text = navList[g.navIdx].text.toLowerCase();
    const h1Hit = h1Text.includes(q);
    let anyChild = false;
    g.children.forEach(ci => {
      const el = tocEl.querySelector(`[data-nav="${ci}"]`);
      const hit = navList[ci].text.toLowerCase().includes(q);
      el.classList.toggle('hidden-by-search', !(hit || h1Hit));
      if (hit) {
        anyChild = true;
        el.innerHTML = esc(navList[ci].text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
      } else {
        el.innerHTML = esc(navList[ci].text);
      }
    });
    const show = h1Hit || anyChild;
    groupEl.classList.toggle('hidden-by-search', !show);
    if (show && anyChild && !h1Hit) groupEl.classList.add('open');
  });
});

/* ---------- Mobile ---------- */
const sidebar = document.getElementById('sidebar');
const mask = document.getElementById('mask');
document.getElementById('menuBtn').addEventListener('click', () => {
  if (window.innerWidth <= 860) {
    sidebar.classList.remove('collapsed');
    sidebar.classList.toggle('mobile-open');
    mask.classList.toggle('show', sidebar.classList.contains('mobile-open'));
  } else {
    const collapsed = sidebar.classList.toggle('collapsed');
    document.body.classList.toggle('toc-collapsed', collapsed);
    document.getElementById('edgeToggle').classList.toggle('moved', collapsed);
  }
});
document.getElementById('edgeToggle').addEventListener('click', () => {
  if (window.innerWidth > 860) {
    const collapsed = sidebar.classList.toggle('collapsed');
    document.body.classList.toggle('toc-collapsed', collapsed);
    document.getElementById('edgeToggle').classList.toggle('moved', collapsed);
  }
});
document.body.classList.toggle('toc-collapsed', sidebar.classList.contains('collapsed'));
/* ===== 禁用页面缩放 ===== */
window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '_', '0'].includes(e.key)) e.preventDefault();
});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
function closeMobile() { sidebar.classList.remove('mobile-open'); mask.classList.remove('show'); }
mask.addEventListener('click', closeMobile);

/* ---------- Init from hash ---------- */
(function init() {
  const h = location.hash.slice(1);
  if (h && h !== 'all') {
    const ni = navList.findIndex(n => n.id === h);
    if (ni >= 0) { showNav(ni, false); return; }
  }
  showNav(-2, false);
})();
</script>
