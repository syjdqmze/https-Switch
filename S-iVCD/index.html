<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-iVCD</title>
    <style>
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .title-bar {
            height: 40px;
            background-color: #87CEEB;
            display: flex;
            align-items: center;
            padding: 0 8px;
            flex-shrink: 0;
            border-bottom: 1px solid #ccc;
            gap: 2px;
        }

        .menu-item {
            padding: 4px 12px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }

        .menu-item:hover {
            background-color: #e0e0e0;
        }

        .menu-item:active {
            background-color: #d0d0d0;
        }

        .container {
            display: flex;
            flex: 1;
            width: 100%;
            gap: 3px;
            background-color: #87CEEB;
            min-height: 0;
        }

        .col-left {
            flex: 2.5;
            height: 100%;
            background-color: #ffffff;
            border: 5px solid #FFD1DC;
            box-sizing: border-box;
        }

        .col-center {
            flex: 5;
            height: 100%;
            background-color: #87CEEB;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .col-center-top {
            flex: 3;
            width: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #90EE90 40%, #228B22 100%);
            border: 5px solid #FFD1DC;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 公路场景容器 */
        .road-scene {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* 远景树木层（慢速） */
        .trees-far {
            position: absolute;
            bottom: 18%;
            width: 200%;
            height: 22%;
            animation: scrollTrees 8s linear infinite;
            animation-play-state: paused;
        }

        /* 近景树木层（快速） */
        .trees-near {
            position: absolute;
            bottom: 10%;
            width: 200%;
            height: 30%;
            animation: scrollTrees 4s linear infinite;
            animation-play-state: paused;
        }

        /* 公路 */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 18%;
            background: linear-gradient(to bottom, #555 0%, #333 100%);
        }

        /* 公路标线 - 上边缘 */
        .road-markings-top {
            position: absolute;
            top: 0;
            width: 200%;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 30px,
                transparent 30px,
                transparent 60px
            );
            animation: scrollRoad 1s linear infinite;
            animation-play-state: paused;
        }

        /* 公路标线 - 中间线 */
        .road-markings-center {
            position: absolute;
            top: 50%;
            width: 200%;
            height: 3px;
            background: repeating-linear-gradient(
                90deg,
                #ffcc00 0px,
                #ffcc00 40px,
                transparent 40px,
                transparent 80px
            );
            animation: scrollRoad 1s linear infinite;
            animation-play-state: paused;
        }

        /* 公路标线 - 下边缘 */
        .road-markings-bottom {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 30px,
                transparent 30px,
                transparent 60px
            );
            animation: scrollRoad 1s linear infinite;
            animation-play-state: paused;
        }

        /* 树木滚动动画 */
        @keyframes scrollTrees {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 公路标线滚动 */
        @keyframes scrollRoad {
            0% { transform: translateX(0); }
            100% { transform: translateX(-60px); }
        }

        /* 运行状态 */
        .running .trees-far,
        .running .trees-near,
        .running .road-markings-top,
        .running .road-markings-center,
        .running .road-markings-bottom {
            animation-play-state: running;
        }

        .col-center-bottom {
            flex: 1;
            width: 100%;
            background-color: #ffffff;
            border: 5px solid #FFD1DC;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .col-right {
            flex: 2.5;
            height: 100%;
            background-color: #ffffff;
            border: 5px solid #FFD1DC;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 方向按键容器 */
        .direction-pad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            width: 240px;
            height: 210px;
        }

        .direction-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #555;
            user-select: none;
            transition: all 0.1s ease;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .direction-btn:hover {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .direction-btn:active {
            background: linear-gradient(145deg, #d0d0d0, #e6e6e6);
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
            transform: scale(0.95);
        }

        /* 转向灯开关样式 */
        .signal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .signal-btn:hover {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
        }

        .signal-btn:active {
            transform: scale(0.95);
        }

        .signal-btn.active {
            background: linear-gradient(145deg, #ffcc00, #ff9900);
            border-color: #ff8800;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
        }

        .direction-btn.up {
            grid-column: 3;
            grid-row: 1;
        }

        .signal-btn.left-signal {
            grid-column: 2;
            grid-row: 1;
        }

        .signal-btn.right-signal {
            grid-column: 4;
            grid-row: 1;
        }

        .direction-btn.left {
            grid-column: 2;
            grid-row: 2;
        }

        .direction-btn.center {
            grid-column: 3;
            grid-row: 2;
            background: #f0f0f0;
            cursor: default;
        }

        .direction-btn.right {
            grid-column: 4;
            grid-row: 2;
        }

        .direction-btn.down {
            grid-column: 3;
            grid-row: 3;
        }

        /* 灯光开关样式 */
        .beam-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6e6e6, #ffffff);
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-size: 11px;
            font-weight: 500;
            color: #555;
        }

        .beam-btn:hover {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
        }

        .beam-btn:active {
            transform: scale(0.95);
        }

        .beam-btn.active {
            background: linear-gradient(145deg, #ffffcc, #ffee88);
            border-color: #ddaa00;
            box-shadow: 0 0 8px rgba(255, 238, 100, 0.6);
            color: #886600;
        }

        .beam-btn.low-beam {
            grid-column: 2;
            grid-row: 4;
        }

        .beam-btn.high-beam {
            grid-column: 4;
            grid-row: 4;
        }

        /* 速度显示表 */
        .speed-display {
            position: absolute;
            top: 65%;
            left: 58%;
            transform: translateX(-50%);
            background: transparent;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            z-index: 100;
            display: none;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .speed-display .speed-value {
            font-size: 22px;
            color: #ff0000;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .speed-display .speed-unit {
            font-size: 12px;
            color: #ff0000;
            margin-left: 3px;
        }

        /* 车型面板 */
        .car-type-panel {
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }

        /* 文字车型选项（与 Model 3 字体一致） */
        .car-type-text {
            font-size: 16px;
            color: #333;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .car-type-text:hover {
            color: #007bff;
        }

        /* Model 3 置灰 */
        .model3 {
            color: #aaa;
            cursor: not-allowed;
        }

    </style>
    <script>
        // 禁止 Ctrl + 滚轮缩放
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });
    
        // 禁止 Ctrl +/- 键盘缩放
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
                e.preventDefault();
            }
        }, { passive: false });
    
        // 禁止手势缩放（双指）
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        }, { passive: false });
    
        // 控制皮卡车运行/停止
        let isRunning = false;

        // 暂停车辆动画（车轮、颠簸、阴影）
        function pauseVehicleAnimations() {
            const anims = ['rearWheelSpin', 'frontWheelSpin', 'bodyBounce', 'shadowBounce'];
            anims.forEach(function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.setAttribute('dur', 'indefinite');
                    el.endElement();
                }
            });
        }

        // 恢复车辆动画
        function resumeVehicleAnimations() {
            const anims = ['rearWheelSpin', 'frontWheelSpin', 'bodyBounce', 'shadowBounce'];
            const durs = ['0.6s', '0.6s', '0.8s', '0.8s'];
            anims.forEach(function(id, index) {
                const el = document.getElementById(id);
                if (el) {
                    el.setAttribute('dur', durs[index]);
                    el.beginElement();
                }
            });
        }

        // 速度控制系统
        let currentSpeed = 0;           // 当前速度 (Km/h)
        let isAccelerating = false;     // 是否正在加速
        let speedTimer = null;          // 加速定时器
        const ACCEL_RATE = 3.5;        // 加速度: 3.5 Km/h 每次
        const ACCEL_INTERVAL = 1000;   // 加速间隔: 1秒

        // 开始加速（按下向上键）
        function startAccelerate() {
            if (isAccelerating) return;
            isAccelerating = true;

            // 如果车辆未运行，启动运行
            if (!isRunning) {
                isRunning = true;
                const sceneContainer = document.getElementById('sceneContainer');
                sceneContainer.classList.add('running');
                resumeVehicleAnimations();
            }

            // 显示速度表
            document.getElementById('speedDisplay').style.display = 'block';

            // 清除之前的定时器
            if (speedTimer) {
                clearInterval(speedTimer);
            }

            // 立即增加一次速度
            currentSpeed += ACCEL_RATE;
            updateSpeedDisplay();

            // 开始定时加速
            speedTimer = setInterval(function() {
                currentSpeed += ACCEL_RATE;
                updateSpeedDisplay();
            }, ACCEL_INTERVAL);
        }

        // 停止加速（松开向上键）—— 车辆保持当前速度匀速运行
        function stopAccelerate() {
            if (!isAccelerating) return;
            isAccelerating = false;

            if (speedTimer) {
                clearInterval(speedTimer);
                speedTimer = null;
            }
            // 车辆保持当前速度匀速运行，速度表保持显示
        }

        // 制动减速系统
        let isBraking = false;        // 是否正在制动
        let brakeTimer = null;        // 制动定时器
        const BRAKE_RATE = 4.5;      // 制动减速度: 4.5 Km/h 每次
        const BRAKE_INTERVAL = 1000; // 制动间隔: 1秒

        // 开始制动减速（按下向下键）
        function startBrake() {
            if (isBraking) return;
            isBraking = true;

            // 点亮制动灯
            const brakes = document.getElementById('brakeLights');
            if (brakes) {
                brakes.style.display = 'inline';
            }

            // 清除之前的定时器
            if (brakeTimer) {
                clearInterval(brakeTimer);
            }

            // 立即减少一次速度
            currentSpeed = Math.max(0, currentSpeed - BRAKE_RATE);
            updateSpeedDisplay();

            // 开始定时制动减速
            brakeTimer = setInterval(function() {
                currentSpeed = Math.max(0, currentSpeed - BRAKE_RATE);
                updateSpeedDisplay();

                // 速度降到0时自动停止制动
                if (currentSpeed <= 0) {
                    currentSpeed = 0;
                    updateSpeedDisplay();
                    endBraking();
                }
            }, BRAKE_INTERVAL);
        }

        // 停止制动减速（松开向下键）—— 车辆保持当前速度匀速行驶
        function stopBrake() {
            if (!isBraking) return;
            endBraking();
        }

        // 结束制动（内部函数，统一处理清理逻辑）
        function endBraking() {
            isBraking = false;

            if (brakeTimer) {
                clearInterval(brakeTimer);
                brakeTimer = null;
            }

            // 熄灭制动灯
            const brakes = document.getElementById('brakeLights');
            if (brakes) {
                brakes.style.display = 'none';
            }
        }

        // 更新速度显示及场景滚动速度
        function updateSpeedDisplay() {
            const speedValue = document.getElementById('speedValue');
            if (speedValue) {
                speedValue.textContent = Math.round(currentSpeed);
            }

            // 根据车速动态调整树木和公路标线后退速度
            // 基准: 20 Km/h 对应基础动画周期（低速慢退，高速快退）
            const baseSpeed = 20;
            const farBase = 10;   // 远景树木基础周期(秒)
            const nearBase = 5;   // 近景树木基础周期(秒)
            const roadBase = 1.2; // 公路标线基础周期(秒)

            if (currentSpeed > 0) {
                const ratio = baseSpeed / currentSpeed;
                const farDur = Math.max(0.5, farBase * ratio);
                const nearDur = Math.max(0.3, nearBase * ratio);
                const roadDur = Math.max(0.1, roadBase * ratio);

                const treesFar = document.querySelector('.trees-far');
                const treesNear = document.querySelector('.trees-near');
                const roadTop = document.querySelector('.road-markings-top');
                const roadCenter = document.querySelector('.road-markings-center');
                const roadBottom = document.querySelector('.road-markings-bottom');

                if (treesFar) { treesFar.style.animationDuration = farDur + 's'; treesFar.style.animationPlayState = ''; }
                if (treesNear) { treesNear.style.animationDuration = nearDur + 's'; treesNear.style.animationPlayState = ''; }
                if (roadTop) { roadTop.style.animationDuration = roadDur + 's'; roadTop.style.animationPlayState = ''; }
                if (roadCenter) { roadCenter.style.animationDuration = roadDur + 's'; roadCenter.style.animationPlayState = ''; }
                if (roadBottom) { roadBottom.style.animationDuration = roadDur + 's'; roadBottom.style.animationPlayState = ''; }
            } else {
                // 速度为0时暂停场景动画
                const els = document.querySelectorAll('.trees-far, .trees-near, .road-markings-top, .road-markings-center, .road-markings-bottom');
                els.forEach(function(el) {
                    el.style.animationPlayState = 'paused';
                });
            }
        }

        // 近光灯/远光灯开关控制
        let lowBeamOn = false;
        let highBeamOn = false;
        let lowBeamForcedByHighBeam = false; // 近光灯是否由远光灯联动点亮

        function toggleBeam(type) {
            if (type === 'low') {
                // 远光灯点亮状态时，不能熄灭近光灯
                if (highBeamOn && lowBeamOn) return;
                lowBeamOn = !lowBeamOn;
                lowBeamForcedByHighBeam = false; // 用户手动操作，清除联动标记
                const btn = document.querySelector('.low-beam');
                btn.classList.toggle('active', lowBeamOn);
                updateLowBeam();
            } else if (type === 'high') {
                highBeamOn = !highBeamOn;
                const btn = document.querySelector('.high-beam');
                btn.classList.toggle('active', highBeamOn);
                updateHighBeam();

                if (highBeamOn) {
                    // 开启远光灯时：如果近光灯熄灭，则联动点亮近光灯
                    if (!lowBeamOn) {
                        lowBeamOn = true;
                        lowBeamForcedByHighBeam = true;
                        const lowBtn = document.querySelector('.low-beam');
                        lowBtn.classList.add('active');
                        updateLowBeam();
                    }
                } else {
                    // 熄灭远光灯时：仅当近光灯是由远光灯联动点亮时，才同时熄灭
                    if (lowBeamForcedByHighBeam) {
                        lowBeamOn = false;
                        lowBeamForcedByHighBeam = false;
                        const lowBtn = document.querySelector('.low-beam');
                        lowBtn.classList.remove('active');
                        updateLowBeam();
                    }
                }
            }
        }

        // 更新近光灯 SVG 状态
        function updateLowBeam() {
            const lights = document.getElementById('lowBeamLights');
            if (lights) {
                lights.style.display = lowBeamOn ? 'inline' : 'none';
            }
        }

        // 更新远光灯 SVG 状态
        function updateHighBeam() {
            const lights = document.getElementById('highBeamLights');
            if (lights) {
                lights.style.display = highBeamOn ? 'inline' : 'none';
            }
        }

        // 转向灯开关控制
        let leftSignalOn = false;
        let rightSignalOn = false;

        function toggleSignal(direction) {
            if (direction === 'left') {
                leftSignalOn = !leftSignalOn;
                const btn = document.querySelector('.left-signal');
                btn.classList.toggle('active', leftSignalOn);
                updateTurnSignals();
            } else if (direction === 'right') {
                rightSignalOn = !rightSignalOn;
                const btn = document.querySelector('.right-signal');
                btn.classList.toggle('active', rightSignalOn);
                updateTurnSignals();
            }
        }

        // 更新转向灯 SVG 状态
        function updateTurnSignals() {
            const signals = document.getElementById('turnSignals');
            if (signals) {
                signals.style.display = (leftSignalOn || rightSignalOn) ? 'inline' : 'none';
            }
        }

        // 转向灯闪烁计数器
        let turnSignalTimer = null;
        let turnSignalFlashes = 0;
        const MAX_FLASHES = 6;

        // 左转函数：闪烁左转向灯 6 次后熄灭
        function turnLeft() {
            // 清除之前的定时器
            if (turnSignalTimer) {
                clearInterval(turnSignalTimer);
            }
            // 重置状态
            rightSignalOn = false;
            document.querySelector('.right-signal').classList.remove('active');
            
            leftSignalOn = true;
            document.querySelector('.left-signal').classList.add('active');
            updateTurnSignals();
            
            // 开始闪烁计数
            turnSignalFlashes = 0;
            turnSignalTimer = setInterval(function() {
                turnSignalFlashes++;
                leftSignalOn = !leftSignalOn;
                updateTurnSignals();
                
                // 闪烁 6 次后停止（每次闪烁包含开和关，所以 6 次 = 12 个切换）
                if (turnSignalFlashes >= MAX_FLASHES * 2) {
                    clearInterval(turnSignalTimer);
                    turnSignalTimer = null;
                    leftSignalOn = false;
                    document.querySelector('.left-signal').classList.remove('active');
                    updateTurnSignals();
                }
            }, 500); // 500ms 切换一次，1秒一个完整闪烁
        }

        // 右转函数：闪烁右转向灯 6 次后熄灭
        function turnRight() {
            // 清除之前的定时器
            if (turnSignalTimer) {
                clearInterval(turnSignalTimer);
            }
            // 重置状态
            leftSignalOn = false;
            document.querySelector('.left-signal').classList.remove('active');
            
            rightSignalOn = true;
            document.querySelector('.right-signal').classList.add('active');
            updateTurnSignals();
            
            // 开始闪烁计数
            turnSignalFlashes = 0;
            turnSignalTimer = setInterval(function() {
                turnSignalFlashes++;
                rightSignalOn = !rightSignalOn;
                updateTurnSignals();
                
                // 闪烁 6 次后停止
                if (turnSignalFlashes >= MAX_FLASHES * 2) {
                    clearInterval(turnSignalTimer);
                    turnSignalTimer = null;
                    rightSignalOn = false;
                    document.querySelector('.right-signal').classList.remove('active');
                    updateTurnSignals();
                }
            }, 500);
        }

        // 喇叭音效系统
        let hornAudioCtx = null;
        let hornOscillators = [];
        let hornGainNode = null;
        let isHornPlaying = false;

        function startHorn() {
            if (isHornPlaying) return;
            isHornPlaying = true;

            // 创建音频上下文
            if (!hornAudioCtx) {
                hornAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // 恢复音频上下文（浏览器安全策略要求用户交互后才能播放音频）
            var ctx = hornAudioCtx;
            var resumePromise = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();

            resumePromise.then(function() {
                if (!isHornPlaying) return; // 在等待恢复期间已松开，取消发声

                // 创建增益节点（控制音量）
                hornGainNode = ctx.createGain();
                hornGainNode.gain.value = 0.5;
                hornGainNode.connect(ctx.destination);

                // 创建多个振荡器模拟汽车喇叭声
                // 低频方波 + 中频锯齿波 = 更真实的喇叭音色
                var hornConfig = [
                    { freq: 350, type: 'square', gain: 0.4 },
                    { freq: 440, type: 'square', gain: 0.3 },
                    { freq: 520, type: 'sawtooth', gain: 0.2 }
                ];
                hornConfig.forEach(function(cfg) {
                    var osc = ctx.createOscillator();
                    osc.type = cfg.type;
                    osc.frequency.value = cfg.freq;
                    var oscGain = ctx.createGain();
                    oscGain.gain.value = cfg.gain;
                    osc.connect(oscGain);
                    oscGain.connect(hornGainNode);
                    osc.start();
                    hornOscillators.push(osc);
                });
            });

            // 高亮喇叭按键
            var centerBtn = document.querySelector('.direction-btn.center');
            if (centerBtn) {
                centerBtn.style.background = 'linear-gradient(145deg, #ffcc00, #ff9900)';
                centerBtn.style.boxShadow = '0 0 8px rgba(255, 170, 0, 0.5)';
            }
        }

        function stopHorn() {
            if (!isHornPlaying) return;
            isHornPlaying = false;

            // 停止所有振荡器
            hornOscillators.forEach(function(osc) {
                try { osc.stop(); } catch(e) {}
            });
            hornOscillators = [];

            // 断开增益节点
            if (hornGainNode) {
                hornGainNode.disconnect();
                hornGainNode = null;
            }

            // 恢复喇叭按键样式
            const centerBtn = document.querySelector('.direction-btn.center');
            if (centerBtn) {
                centerBtn.style.background = '';
                centerBtn.style.boxShadow = '';
            }
        }

        // 页面加载时初始化灯光状态
        document.addEventListener('DOMContentLoaded', function() {
            updateLowBeam();
            updateHighBeam();
            updateTurnSignals();
            // 制动灯默认熄灭
            const brakes = document.getElementById('brakeLights');
            if (brakes) {
                brakes.style.display = 'none';
            }
            // 车辆默认停止，暂停车轮等动画
            pauseVehicleAnimations();
        });
    </script>

                                <animate attributeName="opacity" values="0;0.4;0" dur="1.2s" repeatCount="indefinite"/>
                            </line>
                            <line x1="-15" y1="260" x2="-45" y2="260" stroke="#999" stroke-width="0.8" stroke-linecap="round">
                                <animate attributeName="x1" values="-15;-85;-15" dur="1s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="-45;-115;-45" dur="1s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" values="0;0.3;0" dur="1s" repeatCount="indefinite"/>
                            </line>
                        </g>
                        </g>
                    </svg>
                    </div>
                </div>
                <div class="col-center-bottom"></div>
            </div>
            <div class="col-right">
                <div class="direction-pad">
                    <!-- 左转灯开关 -->
                    <div class="signal-btn left-signal" onclick="toggleSignal('left')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2">
                            <polygon points="12,4 4,12 12,20"/>
                            <line x1="16" y1="12" x2="22" y2="12"/>
                        </svg>
                    </div>
                    <!-- 上箭头 -->
                    <div class="direction-btn up" id="upArrow"
                         onmousedown="startAccelerate()"
                         onmouseup="stopAccelerate()"
                         onmouseleave="stopAccelerate()"
                         ontouchstart="startAccelerate()"
                         ontouchend="stopAccelerate()">&#9650;</div>
                    <!-- 右转灯开关 -->
                    <div class="signal-btn right-signal" onclick="toggleSignal('right')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2">
                            <polygon points="12,4 20,12 12,20"/>
                            <line x1="2" y1="12" x2="8" y2="12"/>
                        </svg>
                    </div>
                    <!-- 左箭头 -->
                    <div class="direction-btn left" onclick="turnLeft()">&#9664;</div>
                    <!-- 中间喇叭 -->
                    <div class="direction-btn center"
                         onmousedown="startHorn()"
                         onmouseup="stopHorn()"
                         onmouseleave="stopHorn()"
                         ontouchstart="startHorn()"
                         ontouchend="stopHorn()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                    </div>
                    <!-- 右箭头 -->
                    <div class="direction-btn right" onclick="turnRight()">&#9654;</div>
                    <!-- 下箭头 -->
                    <div class="direction-btn down" id="downArrow"
                         onmousedown="startBrake()"
                         onmouseup="stopBrake()"
                         onmouseleave="stopBrake()"
                         ontouchstart="startBrake()"
                         ontouchend="stopBrake()">&#9660;</div>
                    <!-- 近光灯开关 -->
                    <div class="beam-btn low-beam" onclick="toggleBeam('low')">近光</div>
                    <!-- 远光灯开关 -->
                    <div class="beam-btn high-beam" onclick="toggleBeam('high')">远光</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
